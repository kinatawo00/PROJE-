<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Domates Savaşı</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#23202a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Yerleşim: tam ekran izometrik savaş alanı; üstte rakip şeridi, altta demir-pirinç komuta paneli. Tek tema (karanlık gotik). */
:root {
  color-scheme: dark;
  --ground: #5f8442;
  --ink: #1b1714;
  --iron: rgba(35, 32, 42, .93);
  --brass: #b08d3a;
  --paper: #f3e8cf;
  --blood: #c8352b;
  --sun: #ffc73a;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground); color: var(--paper); font-family: var(--body); font-weight: 600;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.bar {
  position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.bar > * { pointer-events: auto; }
#top { top: env(safe-area-inset-top, 0px); padding-block: 6px; display: flex; gap: 6px; align-items: center; }
#bottom { bottom: env(safe-area-inset-bottom, 0px); padding-block: 6px; display: flex; flex-direction: column; gap: 5px; }
.grow { flex: 1; min-width: 0; }
.panel { background: var(--iron); border: 2px solid var(--brass); border-radius: 10px; }
.chip { padding: 4px 9px; font-size: 13px; display: flex; gap: 6px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.chip b { font-family: var(--display); font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.live { width: 8px; height: 8px; border-radius: 50%; background: #5fe06a; flex: none; }
.hp { width: 54px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.5); overflow: hidden; flex: none; }
.hp i { display: block; height: 100%; width: 100%; background: #5fe06a; transition: width .2s; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.btn { background: var(--iron); border: 2px solid var(--brass); border-radius: 10px; padding: 5px 10px; font-family: var(--display); font-weight: 800; font-size: 14px; flex: none; }
.btn.primary { background: var(--blood); border-color: #7d1711; color: #fff; font-size: 18px; padding: 9px 22px; box-shadow: 0 4px 0 #7d1711; }
.btn:disabled { opacity: .5; }

#banner {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 2;
  background: var(--iron); border-radius: 8px; padding: 3px 10px; font-family: var(--display); font-weight: 800; font-size: 12px; line-height: 1.3;
  white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
#toast {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 3;
  font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1.05; text-align: center;
  color: var(--sun); text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(0,0,0,.5); pointer-events: none; width: max-content; max-width: 90%;
  animation: pop 1.6s ease-out forwards;
}
#toast small { display: block; font-size: 15px; color: var(--paper); }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 25% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }

#res { display: flex; align-items: center; gap: 8px; padding: 3px 9px; font-size: 13px; }
#gold { font-family: var(--display); font-weight: 800; font-size: 17px; color: var(--sun); font-variant-numeric: tabular-nums; min-width: 52px; }
#inc { opacity: .8; font-variant-numeric: tabular-nums; }
#res .hp { flex: 1; width: auto; height: 10px; }
#units, #acts { display: grid; gap: 5px; }
#units { grid-template-columns: repeat(4, minmax(0, 1fr)); }
#acts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ucard { padding: 3px 2px 4px; display: flex; flex-direction: column; align-items: center; min-width: 0; position: relative; }
.ucard canvas { width: 40px; height: 40px; }
.ucard .nm { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ucard .ct, .act small { font-family: var(--display); font-weight: 800; font-size: 14px; line-height: 1; color: var(--sun); font-variant-numeric: tabular-nums; }
.ucard.off canvas, .ucard.off span { opacity: .4; }
.act.off { color: rgba(243, 232, 207, .4); }
.act.off small { opacity: .5; }
.act { padding: 6px 4px; font-family: var(--display); font-weight: 800; font-size: 14px; display: flex; gap: 6px; align-items: baseline; justify-content: center; min-width: 0; white-space: nowrap; }

#log { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); z-index: 2; bottom: 200px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; max-width: 70%; }
#log div { background: rgba(20, 18, 26, .8); border-radius: 8px; padding: 2px 8px; font-size: 13px; width: max-content; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: fade 7s forwards; }
@keyframes fade { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
#chat { position: absolute; left: 0; right: 0; z-index: 4; bottom: 0; padding: 8px max(12px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--iron); border-top: 2px solid var(--brass); display: flex; flex-direction: column; gap: 8px; }
#emo { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
#emo button { font-size: 24px; line-height: 1; padding: 6px 0; background: rgba(255,255,255,.08); border-radius: 8px; }
#chatForm { display: flex; gap: 6px; }
#chatIn, .field input, .share input { font: inherit; font-size: 16px; color: var(--ink); background: #fff; border: 2px solid #b9a36a; border-radius: 10px; padding: 7px 9px; min-width: 0; -webkit-user-select: text; user-select: text; }
#chatIn { flex: 1; }

#modal { position: absolute; inset: 0; z-index: 5; background: rgba(15, 12, 20, .72); display: flex; align-items: center; justify-content: center; padding: 12px max(12px, env(safe-area-inset-left, 0px)); }
.card { background: var(--paper); color: var(--ink); border: 4px solid var(--brass); border-radius: 18px; padding: 16px 14px 14px; width: 100%; max-width: 380px; max-height: 100%; overflow: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px; text-align: center; }
.card h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; color: var(--blood); text-wrap: balance; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; font-size: 14px; line-height: 1.4; }
.card ul { margin: 0; padding-left: 18px; text-align: left; font-size: 13px; line-height: 1.4; }
.card .note { font-size: 13px; background: #e6d7ac; border-radius: 10px; padding: 7px 10px; }
.card .note.bad { background: #f1c4bd; }
.card .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.card .btn { background: #e0cf9f; border-color: #b9a36a; color: var(--ink); }
.card .btn.primary { background: var(--blood); border-color: #7d1711; color: #fff; }
.field { display: flex; flex-direction: column; gap: 4px; text-align: left; font-size: 13px; font-weight: 800; }
.field input { font-weight: 800; }
.share { display: flex; gap: 6px; align-items: stretch; }
.share input { flex: 1; font-size: 13px; }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pc { background: #e6d7ac; border: 3px solid #b9a36a; border-radius: 14px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 14px; }
.pc img { width: 84px; height: 100px; object-fit: contain; }
.pc.sel { border-color: var(--blood); background: #ffe9a8; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <header id="top" class="bar">
    <div id="enemyChip" class="chip panel"></div>
    <div class="grow"></div>
    <button id="chatBtn" class="btn" type="button">Sohbet</button>
    <button id="menuBtn" class="btn" type="button">Menü</button>
  </header>
  <div id="banner">Yükleniyor…</div>
  <div id="toast" hidden></div>
  <div id="log"></div>
  <footer id="bottom" class="bar">
    <div id="res" class="panel"><span id="gold">0</span><span id="inc"></span><span>Kalen</span><div class="hp" id="myHp"><i></i></div></div>
    <div id="units"></div>
    <div id="acts">
      <button class="act panel" id="aRepair" type="button">Onar <small>40</small></button>
      <button class="act panel" id="aShield" type="button">Kalkan <small>60</small></button>
      <button class="act panel" id="aUp" type="button">Yükselt <small>120</small></button>
    </div>
  </footer>
  <div id="chat" hidden>
    <div id="emo"></div>
    <form id="chatForm"><input id="chatIn" type="text" maxlength="60" autocomplete="off" placeholder="Mesaj yaz…" aria-label="Mesaj"><button class="btn" type="submit">Gönder</button><button class="btn" type="button" id="chatClose">Kapat</button></form>
  </div>
  <div id="modal"></div>
</div>

<script src="mqtt.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- Sabitler ---------- */
const W = 100, H = 160, TAU = Math.PI * 2, INK = '#1b1714';
const LX = [22, 50, 78], TWX = [36, 64];
const WALL_Y = { A: 122, B: 38 }, KEEP_Y = { A: 143, B: 17 }, SPAWN_Y = { A: 118, B: 42 };
const UNITS = {
  m: { name: 'Muhafız',   hp: 60,  dmg: 8,  rate: 0.8, range: 5,  sp: 9,   cost: 20,  lvl: 1 },
  n: { name: 'Nişancı',   hp: 35,  dmg: 7,  rate: 0.9, range: 26, sp: 8,   cost: 30,  lvl: 1 },
  z: { name: 'Zırhlı',    hp: 220, dmg: 14, rate: 1.2, range: 6,  sp: 5.5, cost: 70,  lvl: 2 },
  d: { name: 'Demir Dev', hp: 420, dmg: 45, rate: 2.0, range: 12, sp: 4,   cost: 150, lvl: 3, siege: 2 },
};
const ORDER = ['m', 'n', 'z', 'd'], UPC = [0, 120, 260], INCOME = [0, 5, 7, 9], MAXU = 14;
const TEAM = {
  A: { main: '#d9a02b', dark: '#8a5f0e', light: '#f4cf6a', glow: '#ff5a3c', name: 'Altın' },
  B: { main: '#3f86cf', dark: '#1d4f8c', light: '#86c0f2', glow: '#5ff0ff', name: 'Mavi' },
};
const CH = { cap: { label: 'Şapkalı' }, hair: { label: 'Dağınık saç' } };
const EMOJI = ['😀', '😂', '😡', '😭', '👍', '🍅', '💀', '👑'];
const other = s => (s === 'A' ? 'B' : 'A');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const mult = l => 1 + 0.3 * (l - 1);
const MAXHP = l => ({ keep: 1000 * mult(l), wall: 500 * mult(l), tw: 300 * mult(l) });
const $ = id => document.getElementById(id);
const LS = 'domates-savasi-v3';

/* ---------- Durum ---------- */
const G = { players: { A: null, B: null } };          // profiller
const onl = {};
let me = 'A', canPlay = false, online = false, started = false, ready = false;
let myUid = '', room = '', net = null, note = '', noteBad = false;
let S = null;            // bu cihaz simülasyonu yürütüyorsa (oda sahibi ya da bota karşı)
let V = null;            // çizilen son durum
let localBot = false, lastSnapAt = 0, selLane = 1, modalKind = '';
let FID = 1;
const nameOf = side => { const p = G.players[side]; return (p && p.name) || (S && S.bot === side ? 'Bot' : TEAM[side].name); };
const chOf = side => { const p = G.players[side]; return p && CH[p.ch] ? p.ch : side === 'A' ? 'cap' : 'hair'; };
const norm = d => (d ? { uid: String(d.uid || ''), name: String(d.name || '').slice(0, 12), ch: CH[d.ch] ? d.ch : '', wins: +d.wins || 0, xp: +d.xp || 0, v: +d.v || 0 } : null);
const lvlOf = p => 1 + Math.floor(Math.sqrt(((p && p.xp) || 0) / 60));

/* ---------- Simülasyon (oda sahibinde ya da bot maçında çalışır) ---------- */
const newSide = () => ({ gold: 60, lvl: 1, keep: 1000, wall: 500, tw: [300, 300], tc: [0, 0], sh: 0, cb: 0, cs: 0, cr: 0, dmg: 0 });
const newSim = () => ({ t: 0, ph: 'lobby', cd: 0, win: null, bot: null, rdy: { A: false, B: false }, P: { A: newSide(), B: newSide() }, U: [], Bm: [], fx: [], nid: 1, bt: 1.5 });
function fx(...a) { a.unshift(FID++); S.fx.push({ a, at: performance.now() }); }
function structFor(e, lane) {
  const p = S.P[e];
  if (lane !== 1) { const i = lane === 0 ? 0 : 1; if (p.tw[i] > 0) return i; }
  return p.wall > 0 ? 'wall' : 'keep';
}
const structPos = (e, st, lane) => (st === 'keep' ? [50, KEEP_Y[e]] : st === 'wall' ? [LX[lane], WALL_Y[e]] : [TWX[st], WALL_Y[e]]);
function hurtStruct(e, st, dmg, by) {
  const p = S.P[e];
  if (p.sh > S.t) { fx('blk', e); return; }
  if (st === 'keep') { p.keep -= dmg; if (p.keep <= 0) { p.keep = 0; if (S.ph === 'play') { S.ph = 'over'; S.win = by; } } }
  else if (st === 'wall') p.wall = Math.max(0, p.wall - dmg);
  else p.tw[st] = Math.max(0, p.tw[st] - dmg);
  S.P[by].dmg += dmg;
}
function applyCmd(side, c) {
  if (!S || !c) return;
  const p = S.P[side];
  if (c.c === 'ready') { if (S.ph === 'lobby' && !S.bot) { S.rdy[side] = true; if (S.rdy.A && S.rdy.B) { S.ph = 'count'; S.cd = 3; } } return; }
  if (c.c === 'bot') { if (S.ph === 'lobby') { S.bot = other(side); S.rdy.A = S.rdy.B = true; S.ph = 'count'; S.cd = 3; } return; }
  if (c.c === 'again') { if (S.ph === 'over') { const keepBot = localBot; S = newSim(); if (keepBot) { /* yerel bot maçı biter */ } } return; }
  if (S.ph !== 'play') return;
  if (c.c === 'spawn') {
    const d = UNITS[c.k], l = c.l | 0;
    if (!d || l < 0 || l > 2 || p.lvl < d.lvl || p.gold < d.cost || S.U.filter(u => u.o === side).length >= MAXU) return;
    p.gold -= d.cost; S.U.push({ id: S.nid++, o: side, k: c.k, l, y: SPAWN_Y[side], hp: d.hp, cd: 0.3 });
  } else if (c.c === 'bomb') {
    if (S.t < p.cb) return;
    p.cb = S.t + 4; S.Bm.push({ o: side, x: clamp(+c.x || 50, 4, 96), y: clamp(+c.y || 80, 4, H - 4), at: S.t + 0.9 }); fx('thr', side);
  } else if (c.c === 'shield') {
    if (p.gold < 60 || S.t < p.cs) return;
    p.gold -= 60; p.sh = S.t + 6; p.cs = S.t + 25; fx('shd', side);
  } else if (c.c === 'repair') {
    if (p.gold < 40 || S.t < p.cr) return;
    const mh = MAXHP(p.lvl), cand = [['keep', p.keep / mh.keep], ['wall', p.wall / mh.wall], [0, p.tw[0] / mh.tw], [1, p.tw[1] / mh.tw]].sort((a, b) => a[1] - b[1])[0];
    if (cand[1] >= 1) return;
    p.gold -= 40; p.cr = S.t + 3;
    const add = 150 * mult(p.lvl), st = cand[0];
    if (st === 'keep') p.keep = Math.min(mh.keep, p.keep + add); else if (st === 'wall') p.wall = Math.min(mh.wall, p.wall + add); else p.tw[st] = Math.min(mh.tw, p.tw[st] + add);
    const [x, y] = structPos(side, st, 1); fx('rep', x, y);
  } else if (c.c === 'up') {
    if (p.lvl >= 3 || p.gold < UPC[p.lvl]) return;
    const a = MAXHP(p.lvl); p.gold -= UPC[p.lvl]; p.lvl++; const b = MAXHP(p.lvl);
    p.keep += b.keep - a.keep; p.wall += b.wall - a.wall; p.tw = p.tw.map(v => (v > 0 ? v + b.tw - a.tw : 0)); fx('up', side);
  }
}
function stepSim(dt) {
  if (S.ph === 'count') { S.cd -= dt; if (S.cd <= 0) { S.ph = 'play'; S.t = 0; } return; }
  if (S.ph !== 'play') return;
  S.t += dt;
  for (const s of ['A', 'B']) S.P[s].gold += INCOME[S.P[s].lvl] * dt;
  for (const u of S.U) {
    const d = UNITS[u.k], dir = u.o === 'A' ? -1 : 1, e = other(u.o), ux = LX[u.l];
    u.cd -= dt;
    let tgt = null, best = 1e9;
    for (const v of S.U) if (v.o !== u.o && v.l === u.l && v.hp > 0) { const dd = Math.abs(v.y - u.y); if (dd <= d.range + 1 && dd < best) { best = dd; tgt = v; } }
    if (tgt) {
      if (u.cd <= 0) { u.cd = d.rate; tgt.hp -= d.dmg; if (tgt.hp <= 0) tgt.kb = u.o; fx(d.range > 8 ? 'sh' : 'hit', ux, u.y, ux, tgt.y, u.o, u.id); }
      continue;
    }
    const st = structFor(e, u.l), ty = st === 'keep' ? KEEP_Y[e] - dir * 10 : WALL_Y[e] - dir * 3;
    if ((ty - u.y) * dir <= d.range) {
      if (u.cd <= 0) { u.cd = d.rate; const [sx, sy] = structPos(e, st, u.l); hurtStruct(e, st, d.dmg * (d.siege || 1), u.o); fx(d.range > 8 ? 'sh' : 'hit', ux, u.y, sx, sy, u.o, u.id); }
    } else if (!S.U.some(v => v !== u && v.o === u.o && v.l === u.l && (v.y - u.y) * dir > 0 && (v.y - u.y) * dir < 3.6)) u.y += dir * d.sp * dt;
  }
  for (const s of ['A', 'B']) { // kuleler
    const p = S.P[s];
    for (let i = 0; i < 2; i++) {
      if (p.tw[i] <= 0) continue;
      p.tc[i] -= dt; if (p.tc[i] > 0) continue;
      let tg = null, b = 34;
      for (const v of S.U) if (v.o !== s && v.hp > 0 && (v.l === 1 || v.l === (i ? 2 : 0))) { const dd = Math.hypot(LX[v.l] - TWX[i], v.y - WALL_Y[s]); if (dd < b) { b = dd; tg = v; } }
      if (tg) { p.tc[i] = 0.7; tg.hp -= 10 * (1 + 0.2 * (p.lvl - 1)); if (tg.hp <= 0) tg.kb = s; fx('sh', TWX[i], WALL_Y[s] - 14, LX[tg.l], tg.y, s, 0); }
    }
  }
  for (let i = S.Bm.length - 1; i >= 0; i--) { // domates bombaları
    const b = S.Bm[i]; if (S.t < b.at) continue;
    S.Bm.splice(i, 1);
    const e = other(b.o), m = 1 + 0.25 * (S.P[b.o].lvl - 1);
    for (const v of S.U) if (v.o === e && Math.hypot(LX[v.l] - b.x, v.y - b.y) < 9) { v.hp -= 40 * m; if (v.hp <= 0) v.kb = b.o; }
    if (Math.abs(b.y - KEEP_Y[e]) < 13 && Math.abs(b.x - 50) < 18) hurtStruct(e, 'keep', 25 * m, b.o);
    else if (Math.abs(b.y - WALL_Y[e]) < 8) hurtStruct(e, Math.abs(b.x - TWX[0]) < 7 ? 0 : Math.abs(b.x - TWX[1]) < 7 ? 1 : 'wall', 25 * m, b.o);
    fx('boom', b.x, b.y);
  }
  for (let i = S.U.length - 1; i >= 0; i--) {
    const u = S.U[i]; if (u.hp > 0) continue;
    S.U.splice(i, 1); fx('die', LX[u.l], u.y, u.o);
    if (u.kb) S.P[u.kb].gold += UNITS[u.k].cost * 0.3;
  }
}
function botThink(dt) {
  const b = S.bot; if (!b || S.ph !== 'play') return;
  S.bt -= dt; if (S.bt > 0) return; S.bt = 1 + Math.random() * 0.9;
  const p = S.P[b], e = other(b), mh = MAXHP(p.lvl);
  if (S.t >= p.cb) {
    const foes = S.U.filter(u => u.o === e).sort((x, y) => Math.abs(x.y - KEEP_Y[b]) - Math.abs(y.y - KEEP_Y[b]));
    if (foes.length && Math.random() < 0.7) applyCmd(b, { c: 'bomb', x: LX[foes[0].l], y: foes[0].y });
    else { const [x, y] = structPos(e, ['keep', 'wall', 0, 1][(Math.random() * 4) | 0], (Math.random() * 3) | 0); applyCmd(b, { c: 'bomb', x, y }); }

  $('gold').textContent = p ? p.g : 0; $('inc').textContent = p ? '+' + INCOME[p.l] + '/sn' : '';
  $('myHp').firstElementChild.style.width = p ? (p.k / MAXHP(p.l).keep * 100).toFixed(0) + '%' : '100%';
  for (const k of ORDER) {
    const b = $('u-' + k); if (!b) continue; const d = UNITS[k], locked = !p || p.l < d.lvl;
    b.classList.toggle('off', !play || locked || p.g < d.cost);
    b.lastChild.textContent = locked && p ? 'Kademe ' + d.lvl : d.cost;
  }
  const act = (id, label, cost, cd, off) => { const b = $(id); b.classList.toggle('off', !play || off || p.g < cost || cd > 0); b.firstChild.textContent = label + ' '; b.lastChild.textContent = cd > 0 ? Math.ceil(cd) + ' sn' : cost; };
  if (p) { act('aRepair', 'Onar', 40, p.cr, false); act('aShield', 'Kalkan', 60, p.cs, false); act('aUp', p.l >= 3 ? 'En üst' : 'Yükselt', p.l >= 3 ? 0 : UPC[p.l], 0, p.l >= 3); if (p.l >= 3) $('aUp').lastChild.textContent = ''; }
  let txt;
  if (!ready) txt = 'Yükleniyor…';
  else if (!V) txt = 'Oda sahibi bekleniyor…';
  else if (V.ph === 'play') txt = !canPlay ? 'İzleyicisin' : p.cb > 0 ? 'Bomba ' + Math.ceil(p.cb) + ' sn · şerit seç, birlik gönder' : 'Bomba hazır: karşı tarafa dokun';
  else if (V.ph === 'count') txt = 'Hazırlan!';
  else if (V.ph === 'over') txt = 'Maç bitti';
  else txt = 'Maç bekleniyor';
  bannerEl.textContent = txt;
  if (modalKind === 'lobby') lobbyRefresh();
}
function ptrWorld(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - ox) / sc, (e.clientY - r.top - oy) / sc]; }
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (!started || !canPlay || !V || V.ph !== 'play') return;
  const [wx, wy] = ptrWorld(e);
  if (wy < H / 2 - 5) { // karşı taraf: domates bombası
    if (V.P[me].cb > 0) { sfx('no'); return; }
    send({ c: 'bomb', x: flip() ? W - wx : wx, y: flip() ? H - wy : wy });
  } else { // kendi tarafım: şerit seç
    let best = 0; LX.forEach((l, i) => { if (Math.abs(vx(l) - wx) < Math.abs(vx(LX[best]) - wx)) best = i; });
    selLane = best; sfx('hit');
  }
});

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function showModal(kind, html) { modalKind = kind; modalEl.innerHTML = '<div class="card">' + html + '</div>'; modalEl.hidden = false; }
function hideModal() { modalKind = ''; modalEl.hidden = true; }
function shareHtml() {
  if (!online) return '';
  return '<div class="share"><input id="roomLink" type="text" readonly aria-label="Oda linki" value="' + esc(location.href) + '"><button class="btn" type="button" data-act="copy">Linki kopyala</button></div>';
}
function startCard() {
  const p = G.players[me], cur = p && CH[p.ch] ? p.ch : (G.players[other(me)] && G.players[other(me)].ch === 'cap' ? 'hair' : chOf(me));
  let line;
  if (!ready) line = '<span id="bootNote">' + esc(bootStage) + '</span>';
  else if (online) line = canPlay ? 'Çevrimiçi oda: <b>' + TEAM[me].name + '</b> takımdasın.' : esc(note);
  else line = (note ? esc(note) + ' ' : '') + 'Çevrimdışı: bota karşı oynayabilirsin.';
  showModal('start',
    '<h1>Domates Savaşı</h1><p>Kaleni koru, karşı kaleyi yık.</p>' +
    (ready && canPlay ? '<label class="field" for="nameIn">Kralın adı<input id="nameIn" type="text" maxlength="12" autocomplete="off" placeholder="' + TEAM[me].name + ' kral" value="' + esc((p && p.name) || '') + '"></label>' +
      '<div class="field">Kralını seç</div><div class="pick">' + Object.keys(CH).map(k => '<button type="button" class="pc' + (k === cur ? ' sel' : '') + '" data-ch="' + k + '"><img src="karakter/' + k + '_front.png" alt="" width="84" height="100">' + CH[k].label + '</button>').join('') + '</div>' : '') +
    '<p class="note' + (noteBad ? ' bad' : '') + '">' + line + '</p>' +
    '<p id="errLine" class="note bad"' + (lastErr ? '' : ' hidden') + '>' + (lastErr ? 'Hata: ' + esc(lastErr) : '') + '</p>' +
    '<div class="row"><button class="btn primary" type="button" data-act="start"' + (ready ? '' : ' disabled') + '>' + (ready ? 'Devam' : 'Bağlanıyor…') + '</button>' +
    (ready ? '' : '<button class="btn" type="button" data-act="solo">Beklemeden bota karşı oyna</button>') + '</div>');
}
function lobbyCard() {
  showModal('lobby',
    '<h2>Savaş hazırlığı</h2>' +
    '<ul><li>Avluna dokunup şerit seç, alttan birlik gönder.</li><li>Karşı tarafa dokununca kralın domates bombası atar.</li><li>Altınla onar, kalkan aç, kaleyi yükselt. Ana kalesi yıkılan kaybeder.</li></ul>' +
    '<p class="note" id="lobSt"></p>' + shareHtml() +
    '<div class="row"><button class="btn primary" type="button" data-act="ready" id="lobReady">Hazırım</button><button class="btn" type="button" data-act="bot">Bota karşı oyna</button></div>');
  lobbyRefresh();
}
function lobbyRefresh() {
  const el = $('lobSt'), rb = $('lobReady'); if (!el) return;
  const en = other(me), ep = G.players[en], hostOk = S ? true : performance.now() - lastSnapAt < 3500 && V, iAm = V && V.r[me === 'A' ? 0 : 1], they = V && V.r[me === 'A' ? 1 : 0];
  let t, can = false;
  if (!online) t = 'Çevrimdışısın. Bota karşı oynayabilirsin.';
  else if (!canPlay) t = 'İzleyicisin.';
  else if (!ep) t = 'Rakibin henüz odaya girmedi. Linki ona gönder.';
  else if (!onl[ep.uid]) t = esc(nameOf(en)) + ' şu an çevrimiçi değil.';
  else if (!hostOk) t = 'Oda sahibi (' + esc(nameOf('A')) + ') bağlanıyor…';
  else if (V.bot) t = esc(nameOf(other(V.bot))) + ' şu an bota karşı oynuyor.';
  else if (iAm) t = they ? 'Başlıyor…' : 'Hazırsın. ' + esc(nameOf(en)) + ' bekleniyor…';
  else { t = esc(nameOf(en)) + ' odada' + (they ? ' ve hazır!' : '.') + ' Hazır olunca bas.'; can = true; }
  el.innerHTML = t; rb.disabled = !can;
}
function resultCard() {
  const won = V.win === me, p = G.players[me], mine = V.P[me];
  if (canPlay && p && !resultCard.done) {
    resultCard.done = true; p.wins = (p.wins || 0) + (won ? 1 : 0); p.xp = (p.xp || 0) + (won ? 60 : 25) + Math.round(mine.d / 40);
    if (net && online) net.saveProfile(); else storeProfile();
  }
  sfx(won ? 'win' : 'lose');
  showModal('result', '<h1>' + (!canPlay ? 'Maç bitti' : won ? 'Zafer!' : 'Yenilgi') + '</h1>' +
    '<p>' + esc(nameOf(V.win)) + ' karşı kaleyi yıktı.</p>' +
    (canPlay && p ? '<p class="note">Verdiğin hasar: <b>' + mine.d + '</b> · Galibiyet: <b>' + p.wins + '</b> · Seviye: <b>' + lvlOf(p) + '</b></p>' : '') +
    '<div class="row"><button class="btn primary" type="button" data-act="again">Yeni maç</button></div>');
}
function phaseChange(from, to) {
  if (!started) return;
  if (to === 'count') { hideModal(); resultCard.done = false; $('chat').hidden = true; }
  else if (to === 'play') { hideModal(); toast('Savaş başladı!'); }
  else if (to === 'over') resultCard();
  else if (to === 'lobby') { if (from === 'play' || from === 'count') toast('Maç sıfırlandı'); lobbyCard(); }
}
function menuCard() {
  showModal('menu', '<h2>Menü</h2>' +
    '<p>' + (online ? 'Oda ' + esc(room) + ' · ' + (canPlay ? TEAM[me].name + ' takım' : 'izleyici') + ' · sunucu ' + net.connected() + '/' + net.total() : 'Çevrimdışı') + '</p>' + shareHtml() +
    '<div class="row"><button class="btn" type="button" data-act="profile">İsim ve kral</button><button class="btn" type="button" data-act="mute">Ses: ' + (muted ? 'kapalı' : 'açık') + '</button></div>' +
    (S && V && V.ph === 'play' ? '<div class="row"><button class="btn" type="button" data-act="quit">Maçı bitir</button></div>' : '') +
    '<div class="row"><button class="btn primary" type="button" data-act="close">Kapat</button></div>');
}
function afterStart() {
  started = true;
  if (V && (V.ph === 'play' || V.ph === 'count')) hideModal(); else if (V && V.ph === 'over') resultCard(); else lobbyCard();
  hud();
}
function startLocalBot() { localBot = true; S = newSim(); RU.clear(); lastFx = 0; prevPh = 'lobby'; applyCmd(me, { c: 'bot' }); }
modalEl.addEventListener('click', e => {
  const pc = e.target.closest('.pc');
  if (pc) { for (const o of modalEl.querySelectorAll('.pc')) o.classList.toggle('sel', o === pc); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  audioInit();
  const a = b.dataset.act;
  if (a === 'start') {
    const p = G.players[me], inp = $('nameIn'), pick = modalEl.querySelector('.pc.sel');
    if (canPlay && p && inp) { p.name = inp.value.trim().slice(0, 12); if (pick) p.ch = pick.dataset.ch; if (net && online) net.saveProfile(); else storeProfile(); buildCards(); }
    afterStart();
  }
  else if (a === 'ready') { send({ c: 'ready' }); lobbyRefresh(); }
  else if (a === 'bot') { if (S && !localBot) applyCmd(me, { c: 'bot' }); else startLocalBot(); }
  else if (a === 'again') {
    if (localBot) { localBot = false; S = null; V = null; RU.clear(); lastFx = 0; prevPh = 'lobby'; setRole(); if (S) adopt(snap()); lobbyCard(); }
    else { send({ c: 'again' }); if (!S) lobbyCard(); }
  }
  else if (a === 'quit') { if (S) { S.ph = 'over'; S.win = other(me); } hideModal(); }
  else if (a === 'close') hideModal();
  else if (a === 'profile') startCard();
  else if (a === 'mute') { muted = !muted; try { localStorage.setItem(LS + '-mute', muted ? '1' : '0'); } catch (err) {} menuCard(); }
  else if (a === 'copy') {
    const inp = $('roomLink'), done = () => { b.textContent = 'Kopyalandı'; };
    const fallback = () => { try { inp.focus(); inp.select(); inp.setSelectionRange(0, 9999); if (document.execCommand('copy')) done(); } catch (err) {} };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inp.value).then(done, fallback); else fallback();
  }
  else if (a === 'solo') { if (!ready) { bootAbort = true; if (net) net.close(); goOffline('Çevrimiçi oda için sayfayı yenile.'); finishBoot(); } }
});
$('menuBtn').addEventListener('click', menuCard);
for (const em of EMOJI) { const b = document.createElement('button'); b.type = 'button'; b.textContent = em; b.addEventListener('click', () => { chatSend(em); $('chat').hidden = true; }); $('emo').append(b); }
$('chatBtn').addEventListener('click', () => { if (!started) return; $('chat').hidden = !$('chat').hidden; });
$('chatClose').addEventListener('click', () => { $('chat').hidden = true; });
$('chatForm').addEventListener('submit', e => { e.preventDefault(); const v = $('chatIn').value.trim(); if (v) { chatSend(v); $('chatIn').value = ''; } $('chat').hidden = true; $('chatIn').blur(); });

/* ---------- Açılış ---------- */
const CANCEL = {};
let bootAbort = false, bootStage = 'Bağlanıyor…', lastErr = '';
function st(t) { if (bootAbort) throw CANCEL; bootStage = t; const el = $('bootNote'); if (el && !ready) el.textContent = t; }
function showErr(m) { lastErr = String(m || 'bilinmeyen hata').slice(0, 160); const el = $('errLine'); if (el) { el.textContent = 'Hata: ' + lastErr; el.hidden = false; } }
window.addEventListener('error', e => showErr(e.message));
window.addEventListener('unhandledrejection', e => showErr(e.reason && (e.reason.code || e.reason.message) || e.reason));
function goOffline(msg, bad) { online = false; note = msg || ''; noteBad = !!bad; me = 'A'; canPlay = true; G.players = { A: { ...loadProfile(), uid: myUid }, B: null }; ready = true; }
function finishBoot() {
  setRole();
  if (S) adopt(snap()); else { S = newSim(); adopt(snap()); S = null; }
  buildCards(); resize(); if (!started) startCard(); hud();
}
async function boot() {
  try { myUid = localStorage.getItem(LS + '-uid') || ''; if (!myUid) { myUid = 'u' + rid(); localStorage.setItem(LS + '-uid', myUid); } } catch (e) { myUid = 'u' + rid(); }
  try {
    if (window.mqtt) {
      const m = /^#([a-z0-9]{4,16})$/.exec(location.hash);
      room = m ? m[1] : '';
      if (!room) { room = Math.random().toString(36).slice(2, 8).padEnd(6, 'x'); try { history.replaceState(null, '', '#' + room); } catch (e) { location.hash = room; } }
      let urls = BROKERS;
      if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { const b = new URLSearchParams(location.search).get('b'); if (b) urls = [b]; }
      st('Oyun sunucusuna bağlanılıyor…');
      net = makeNet(room, urls);
      await net.init();
      if (bootAbort) return;
      online = true; ready = true;
    } else goOffline('Çevrimiçi bağlantı kitaplığı yüklenemedi.', true);
  } catch (e) {
    if (e === CANCEL || bootAbort) return;
    goOffline('Çevrimiçi oyuna bağlanılamadı (' + ((e && (e.code || e.message)) || 'bilinmeyen hata') + ').', true);
  }
  finishBoot();
}
window.addEventListener('hashchange', () => location.reload());

let last = performance.now(), pubAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S) {
    stepSim(dt); botThink(dt);
    adopt(snap());
    if (hosting() && now - pubAt > 200) { pubAt = now; net.state(V); }
  } else if (online && V && now - lastSnapAt > 4000 && V.ph !== 'lobby') { /* oda sahibi koptu: son görüntü kalır */ }
  update(dt); draw();
  requestAnimationFrame(frame);
}
// sekme arka plandayken de maç ilerlesin (oda sahibi için)
setInterval(() => { if (document.hidden && S) { const now = performance.now(), dt = Math.min(0.5, (now - last) / 1000); last = now; let left = dt; while (left > 0) { const d = Math.min(0.05, left); stepSim(d); botThink(d); left -= d; } adopt(snap()); if (hosting()) net.state(V); } }, 250);
window.addEventListener('resize', resize);
resize(); startCard(); hud();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
setInterval(hud, 200);
requestAnimationFrame(frame);
boot();
})();
</script>
