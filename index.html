<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Domates Savaşı</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7dbb4b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Yerleşim: tam ekran çiftlik avlusu (eğik üstten bakış); üstte rakip şeridi, altta ahşap envanter paneli. Tek tema (oyun dünyası). */
:root {
  color-scheme: dark;
  --grass: #7dbb4b;
  --ink: #2a1a0c;
  --wood: rgba(64, 40, 20, .9);
  --wood-hi: #8a5a2b;
  --paper: #fff6dd;
  --tomato: #e5372b;
  --sun: #ffc73a;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--grass); color: var(--paper);
  font-family: var(--body); font-weight: 600;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

.bar {
  position: absolute; left: 0; right: 0; z-index: 2;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
#top { top: env(safe-area-inset-top, 0px); padding-block: 8px; display: flex; gap: 8px; align-items: center; }
#bottom { bottom: env(safe-area-inset-bottom, 0px); padding-block: 8px; display: flex; flex-direction: column; gap: 6px; }
.grow { flex: 1; min-width: 0; }

.chip {
  background: var(--wood); border: 2px solid var(--wood-hi); border-radius: 12px; padding: 4px 10px;
  font-size: 13px; display: flex; gap: 6px; align-items: center; min-width: 0;
  white-space: nowrap; overflow: hidden;
}
.chip b { font-family: var(--display); font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.chip span { flex: none; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }

button { font: inherit; color: inherit; border: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.btn {
  background: var(--wood); border: 2px solid var(--wood-hi); border-radius: 12px; padding: 6px 12px;
  font-family: var(--display); font-weight: 800; font-size: 14px; flex: none;
}
.btn.primary { background: var(--tomato); border-color: #9c1b13; color: #fff; font-size: 18px; padding: 10px 26px; box-shadow: 0 4px 0 #9c1b13; }
.btn.primary:disabled { opacity: .6; }

#banner {
  position: absolute; top: calc(54px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 2;
  background: var(--wood); border-radius: 10px; padding: 4px 12px;
  font-family: var(--display); font-weight: 800; font-size: 13px; line-height: 1.3; text-align: center; white-space: nowrap;
  max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
#banner.warn { background: var(--tomato); color: #fff; }
#banner.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(calc(-50% - 6px)); } 75% { transform: translateX(calc(-50% + 6px)); } }

#toast {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 3;
  font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1.05; text-align: center;
  color: var(--sun); text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(0,0,0,.45);
  pointer-events: none; width: max-content; max-width: 90%;
  animation: pop 1.6s ease-out forwards;
}
#toast small { display: block; font-size: 16px; color: var(--paper); }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  25% { transform: translate(-50%, -50%) scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
}

#lvRow { display: flex; align-items: center; gap: 8px; background: var(--wood); border: 2px solid var(--wood-hi); border-radius: 12px; padding: 3px 10px; font-size: 13px; }
#lvLabel { font-family: var(--display); font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
#xpBar { flex: 1; min-width: 0; height: 10px; border-radius: 999px; background: rgba(0,0,0,.35); overflow: hidden; }
#xpBar i { display: block; height: 100%; width: 0; background: var(--sun); border-radius: 999px; transition: width .3s; }
#xpText { font-variant-numeric: tabular-nums; white-space: nowrap; opacity: .85; }

#items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.item {
  background: var(--wood); border-radius: 12px; padding: 6px 4px 5px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 2px solid var(--wood-hi); min-width: 0;
}
.item .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); box-shadow: inset -3px -3px 0 rgba(0,0,0,.22); }
.item .nm { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.item .ct { font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums; }
.item.sel { border-color: var(--sun); background: rgba(110, 66, 24, .96); }
.item.locked { opacity: .55; }
.item.empty .ct { color: #ff9b93; }

#modal {
  position: absolute; inset: 0; z-index: 5; background: rgba(30, 20, 8, .7);
  display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.card {
  background: var(--paper); color: var(--ink); border: 4px solid var(--wood-hi); border-radius: 20px; padding: 18px 16px 16px;
  width: 100%; max-width: 380px; max-height: 100%; overflow: auto; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 10px; text-align: center;
}
.card h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--tomato); text-wrap: balance; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; font-size: 14px; line-height: 1.4; }
.card ul { margin: 0; padding-left: 18px; text-align: left; font-size: 13px; line-height: 1.4; }
.card .note { font-size: 13px; background: #f1e2b6; border-radius: 10px; padding: 7px 10px; }
.card .note.bad { background: #f9cfc9; }
.card .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.card .btn { background: #ead9aa; border-color: #c9ae6e; color: var(--ink); }
.card .btn.primary { background: var(--tomato); border-color: #9c1b13; color: #fff; }
.card .btn.danger { background: #9c1b13; border-color: #6d100b; color: #fff; }
.field { display: flex; flex-direction: column; gap: 4px; text-align: left; font-size: 13px; font-weight: 800; }
.field input {
  font: inherit; font-size: 16px; font-weight: 800; color: var(--ink); background: #fff; border: 2px solid #c9ae6e; border-radius: 10px;
  padding: 8px 10px; min-width: 0; -webkit-user-select: text; user-select: text;
}
.share { display: flex; gap: 6px; align-items: stretch; }
.share input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink); background: #fff; border: 2px solid #c9ae6e; border-radius: 10px; padding: 6px 8px; -webkit-user-select: text; user-select: text; }
.live { width: 8px; height: 8px; border-radius: 50%; background: #5fe06a; flex: none; }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pc { background: #f1e2b6; border: 3px solid #c9ae6e; border-radius: 14px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; color: var(--ink); font-family: var(--display); font-weight: 800; font-size: 14px; }
.pc canvas { width: 84px; height: 104px; }
.pc.sel { border-color: var(--tomato); background: #ffe9a8; }
</style>
</head>
<body>

<div id="app">
  <canvas id="cv"></canvas>

  <header id="top" class="bar">
    <div id="enemyChip" class="chip"></div>
    <div class="grow"></div>
    <button id="passBtn" class="btn" type="button" hidden>Telefonu ver</button>
    <button id="menuBtn" class="btn" type="button">Menü</button>
  </header>

  <div id="banner">Yükleniyor…</div>
  <div id="toast" hidden></div>

  <footer id="bottom" class="bar">
    <div id="lvRow"><span id="lvLabel">Seviye 1</span><div id="xpBar"><i></i></div><span id="xpText">0 / 60</span></div>
    <div id="items"></div>
  </footer>

  <div id="modal"></div>
</div>

<script src="mqtt.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- Sabitler ---------- */
const W = 100, H = 170, HALF = 85, TICK = 20000, MAXSPLAT = 60, TAU = Math.PI * 2, INK = '#1b1714';
const ITEMS = {
  t: { name: 'Domates',       r: 6.5, xp: 10, unlock: 1, cap0: 50, capStep: 10, every: 1,  col: '#e5372b', dark: '#a3140f' },
  e: { name: 'Çürük yumurta', short: 'Yumurta', r: 8,   xp: 18, unlock: 2, cap0: 10, capStep: 5,  every: 3,  col: '#f4efd2', dark: '#c9c08a' },
  m: { name: 'Çamur topu',    r: 10,  xp: 30, unlock: 4, cap0: 6,  capStep: 3,  every: 6,  col: '#7a4c26', dark: '#4a2c12' },
  p: { name: 'Boya balonu',   r: 12,  xp: 50, unlock: 6, cap0: 4,  capStep: 2,  every: 10, col: '#a44be0', dark: '#6c2a9c' },
};
const ORDER = ['t', 'e', 'm', 'p'];
const PAINT = [['#a44be0', '#6c2a9c'], ['#12b8c9', '#0a7783'], ['#ff5fa2', '#b8306b'], ['#ff8a1f', '#b85a08']];
const TEAM = {
  A: { main: '#e8a32a', dark: '#a86b10', light: '#f6c95c', name: 'Sarı' },
  B: { main: '#3f8fd6', dark: '#1f5c9c', light: '#7fbdf0', name: 'Mavi' },
};
const CH = {
  cap:  { label: 'Şapkalı',     skin: '#f0b877', tee: '#1f1f22', pants: '#3b3b3f', shoe: '#ece7dc', w: 6.0 },
  hair: { label: 'Dağınık saç', skin: '#f5c49a', tee: '#1d1d20', pants: '#232326', shoe: '#3a3a3e', w: 7.6 },
};

/* ---------- Durum ---------- */
const G = { players: { A: null, B: null }, splats: new Map() };
let me = 'A', view = 'A', canPlay = false, online = false, started = false, ready = false;
let myUid = '', be = null, sel = 't', note = '', noteBad = false;
const other = s => (s === 'A' ? 'B' : 'A');
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let room = '', netBE = null;
const onl = {};

function levelInfo(xp) {
  let L = 1, need = 60;
  while (xp >= need) { xp -= need; L++; need = 60 + 40 * (L - 1); }
  return { L, into: xp, need };
}
const lv = p => levelInfo(p ? p.xp || 0 : 0);
const cap = (k, L) => (L < ITEMS[k].unlock ? 0 : ITEMS[k].cap0 + ITEMS[k].capStep * (L - ITEMS[k].unlock));
const baseScale = L => Math.min(1.7, 1 + 0.08 * (L - 1));
const blobCount = (L, type) => Math.min(5, 1 + Math.floor((L - 1) / 2)) + (type === 'p' ? 1 : 0);
const chOf = side => { const p = G.players[side]; return p && CH[p.ch] ? p.ch : side === 'A' ? 'cap' : 'hair'; };
const nameOf = side => { const p = G.players[side]; return (p && p.name) || TEAM[side].name; };
function newPlayer(uid, resetAt, keep) {
  return { uid, name: keep ? keep.name || '' : '', ch: keep ? keep.ch || '' : '', xp: 0, ammo: { t: 50, e: 0, m: 0, p: 0 }, regenAt: Date.now(), tick: 0, cleaned: 0, resetAt: resetAt || 0 };
}
const plain = p => ({ uid: p.uid, name: p.name || '', ch: p.ch || '', xp: p.xp, ammo: { ...p.ammo }, regenAt: p.regenAt, tick: p.tick, cleaned: p.cleaned || 0, resetAt: p.resetAt || 0, v: p.v || 0 });
const norm = d => (d ? { uid: String(d.uid || ''), name: String(d.name || '').slice(0, 12), ch: d.ch || '', xp: +d.xp || 0, ammo: { t: 0, e: 0, m: 0, p: 0, ...(d.ammo || {}) }, regenAt: +d.regenAt || Date.now(), tick: +d.tick || 0, cleaned: +d.cleaned || 0, resetAt: +d.resetAt || 0, v: +d.v || 0 } : null);
const splatData = s => ({ side: s.side, x: s.x, y: s.y, r: s.r, type: s.type, seed: s.seed, by: s.by, at: s.at, g: s.g || '', lv: s.lv || 1 });

function regen(p) {
  if (!p) return;
  let n = Math.floor((Date.now() - p.regenAt) / TICK);
  if (n <= 0) return;
  p.regenAt += n * TICK;
  n = Math.min(n, 2000);
  const L = lv(p).L;
  for (let i = 0; i < n; i++) {
    p.tick++;
    for (const k of ORDER) if (L >= ITEMS[k].unlock && p.tick % ITEMS[k].every === 0 && p.ammo[k] < cap(k, L)) p.ammo[k]++;
  }
}
const dirtyCount = side => { let n = 0; for (const s of G.splats.values()) if (s.side === side) n++; return n; };

/* ---------- Depolama: yerel (tek telefon) ---------- */
const LS = 'domates-savasi-v2';
const localBE = {
  init() {
    try {
      const d = JSON.parse(localStorage.getItem(LS) || 'null');
      if (d && d.players) { G.players = d.players; for (const s of d.splats || []) G.splats.set(s.id, s); }
    } catch (e) {}
    if (!G.players.A) G.players.A = newPlayer('A');
    if (!G.players.B) G.players.B = newPlayer('B');
    myUid = 'local'; me = 'A'; view = 'A'; canPlay = true;
  },
  persist() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        players: { A: plain(G.players.A), B: plain(G.players.B) },
        splats: [...G.splats.values()].map(s => ({ ...splatData(s), id: s.id })),
      }));
    } catch (e) {}
  },
  addSplat(s) { s.id = rid(); G.splats.set(s.id, s); this.persist(); },
  delSplat(id) { G.splats.delete(id); this.persist(); },
  savePlayer() { this.persist(); },
  reset() { G.splats.clear(); G.players.A = newPlayer('A', 0, G.players.A); G.players.B = newPlayer('B', 0, G.players.B); this.persist(); },
};

/* ---------- Depolama: çevrimiçi oda (iki telefon, açık mesaj sunucusu) ---------- */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
function makeNetBE(roomId, urls) {
  const prefix = 'domsav1/' + roomId + '/', clients = [], groups = new Map(), RK = LS + '-oda-' + roomId;
  let saved = null, tomb = new Map(), saveT = null, seated = false, decideT = null, resolveInit = null;
  try { saved = JSON.parse(localStorage.getItem(RK) || 'null'); if (saved && saved.tomb) tomb = new Map(saved.tomb); } catch (e) {}
  const persist = () => {
    try { localStorage.setItem(RK, JSON.stringify({ seat: canPlay ? me : null, player: canPlay && G.players[me] ? plain(G.players[me]) : null, tomb: [...tomb].slice(-300) })); } catch (e) {}
  };
  const pub = (t, payload) => { for (const c of clients) { try { c.publish(prefix + t, payload, { retain: true, qos: 1 }); } catch (e) {} } };
  const flush = () => {
    clearTimeout(saveT); saveT = null;
    if (!canPlay || !G.players[me]) return;
    const p = G.players[me]; p.v = Date.now();
    pub('p/' + me, JSON.stringify(plain(p))); persist();
  };
  function decide() {
    if (seated) return; seated = true;
    const sv = saved && saved.player && saved.player.uid === myUid ? norm(saved.player) : null;
    const order = saved && saved.seat === 'B' ? ['B', 'A'] : ['A', 'B'];
    const mine = order.find(s => G.players[s] && G.players[s].uid === myUid), free = order.find(s => !G.players[s]);
    if (mine) {
      me = mine; canPlay = true;
      const cur = G.players[mine];
      if (sv && (sv.resetAt || 0) >= (cur.resetAt || 0) && (sv.v || 0) > (cur.v || 0)) { G.players[mine] = sv; flush(); }
    } else if (free) {
      const o = G.players[other(free)], oAt = (o && o.resetAt) || 0;
      G.players[free] = sv && (sv.resetAt || 0) >= oAt ? sv : newPlayer(myUid, oAt, sv);
      me = free; canPlay = true; flush();
    } else { me = 'A'; canPlay = false; note = 'Bu odada iki oyuncu da dolu. Şimdilik izleyicisin.'; }
    view = me; persist(); resolveInit();
  }
  function onPlayer(side, d) {
    const cur = G.players[side];
    if (seated && canPlay && side === me) {
      if (d.uid === myUid) { if ((d.resetAt || 0) > (cur.resetAt || 0)) { G.players[me] = d; persist(); toast('Oyun sıfırlandı'); } return; }
      if (myUid < d.uid) { flush(); return; } // aynı yere iki kişi oturduysa küçük kimlik kalır
      const o = other(side);
      G.players[side] = d;
      if (!G.players[o] || G.players[o].uid === myUid) { G.players[o] = cur; me = o; view = o; flush(); toast('Takımın değişti', TEAM[o].name + ' takımdasın'); }
      else { canPlay = false; toast('Oda dolu', 'İzleyicisin'); }
      resetChars(); persist(); return;
    }
    if (!cur || cur.uid !== d.uid || (d.v || 0) >= (cur.v || 0)) G.players[side] = d;
  }
  function onSplat(id, txt) {
    if (!txt) {
      const s = G.splats.get(id);
      if (s) { G.splats.delete(id); if (started && s.side !== me) enemyCleaned(s); }
      return;
    }
    if (tomb.has(id)) { pub('s/' + id, ''); return; }
    if (G.splats.has(id) || incoming.has(id)) return;
    const d = JSON.parse(txt);
    if (!d || (d.side !== 'A' && d.side !== 'B') || !ITEMS[d.type]) return;
    const s = { side: d.side, x: clamp(+d.x || 0, 0, 100), y: clamp(+d.y || 0, 0, 85), r: clamp(+d.r || 5, 2, 26), type: d.type, seed: d.seed | 0, by: String(d.by || ''), at: +d.at || 0, g: String(d.g || ''), lv: +d.lv || 1, id };
    if (started && canPlay && s.side === me && s.by !== myUid && Math.abs(Date.now() - s.at) < 12000) {
      const gk = s.g || id; let grp = groups.get(gk);
      if (!grp) { grp = { landed: false, list: [] }; groups.set(gk, grp); launchIncoming(s, grp); }
      if (grp.landed) G.splats.set(id, s); else { grp.list.push(s); incoming.set(id, s); }
    } else G.splats.set(id, s);
  }
  function onMessage(topic, payload) {
    if (!topic.startsWith(prefix)) return;
    const rest = topic.slice(prefix.length), txt = payload.toString();
    if (rest === 'p/A' || rest === 'p/B') { if (txt) { const d = norm(JSON.parse(txt)); if (d && d.uid) onPlayer(rest[2], d); } }
    else if (rest.startsWith('s/')) onSplat(rest.slice(2), txt);
    else if (rest.startsWith('on/')) onl[rest.slice(3)] = !!txt;
  }
  return {
    init() {
      return new Promise(res => {
        resolveInit = res;
        urls.forEach((url, i) => {
          const topicOn = prefix + 'on/' + myUid;
          const c = mqtt.connect(url, { clientId: 'ds_' + myUid + '_' + i + '_' + rid().slice(-4), clean: true, keepalive: 30, reconnectPeriod: 4000, connectTimeout: 9000, will: { topic: topicOn, payload: '', retain: true, qos: 0 } });
          clients.push(c);
          c.on('connect', () => {
            c.subscribe(prefix + '#', { qos: 1 }, () => {
              if (!seated && !decideT && !bootAbort) { st('Oda okunuyor…'); decideT = setTimeout(decide, 1800); }
            });
            c.publish(topicOn, '1', { retain: true, qos: 0 });
            if (seated && canPlay) flush();
          });
          c.on('message', (topic, payload) => { try { onMessage(topic, payload); } catch (e) {} });
          c.on('error', () => {});
        });
      });
    },
    connected: () => clients.filter(c => c.connected).length,
    total: () => clients.length,
    close() { clearTimeout(decideT); for (const c of clients) { try { c.end(true); } catch (e) {} } },
    addSplat(s) { s.id = rid(); G.splats.set(s.id, s); pub('s/' + s.id, JSON.stringify(splatData(s))); },
    delSplat(id) { G.splats.delete(id); tomb.set(id, Date.now()); pub('s/' + id, ''); persist(); },
    savePlayer() { if (!saveT) saveT = setTimeout(flush, 500); },
    flush,
    reset() {
      const at = Date.now();
      for (const id of [...G.splats.keys()]) this.delSplat(id);
      for (const side of ['A', 'B']) {
        const p = G.players[side];
        if (!p) continue;
        const np = newPlayer(p.uid, at, p); np.v = at;
        G.players[side] = np; pub('p/' + side, JSON.stringify(plain(np)));
      }
      persist();
    },
  };
}

/* ---------- Tuval ve koordinatlar ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let cw = 0, ch = 0, dpr = 1, sc = 1, ox = 0, oy = 0;
function resize() {
  const r = cv.getBoundingClientRect();
  cw = r.width; ch = r.height; dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const topH = $('top').offsetHeight + 30, botH = $('bottom').offsetHeight + 4;
  sc = Math.max(0.5, Math.min(cw / W, (ch - topH - botH) / H));
  ox = (cw - W * sc) / 2; oy = topH + (ch - topH - botH - H * sc) / 2;
}
const toWorld = (side, x, y) => (side === view ? [x, HALF + y] : [W - x, HALF - y]);
const toLocal = (side, wx, wy) => (side === view ? [wx, wy - HALF] : [W - wx, HALF - wy]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  g = g || ctx; r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* ---------- Karakterler, mermiler, parçacıklar ---------- */
const chars = { me: null, enemy: null };
function resetChars() {
  chars.me = { x: 50, y: HALF + 44, tx: 50, ty: HALF + 44, dir: 'up', home: 'up', walk: 0, throwT: 0, scrub: 0, moving: false, still: 0 };
  chars.enemy = { x: 50, y: HALF - 44, tx: 50, ty: HALF - 44, dir: 'down', home: 'down', walk: 0, throwT: 0, scrub: 0, moving: false, still: 0, idle: 2 };
}
resetChars();
const shots = [], parts = [], incoming = new Map();
let shake = 0, cooldown = 0, time = 0;
const ptr = { down: false, x: 0, y: 0, aiming: false };
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function splatColors(s) {
  if (s.type === 'p') return PAINT[(s.seed >>> 3) % PAINT.length];
  return [ITEMS[s.type].col, ITEMS[s.type].dark];
}
function burstCols(s) {
  if (s.type === 't') return ['#e5372b', '#a3140f', '#ff6a55', '#f6d27a'];
  if (s.type === 'e') return ['#f4efd2', '#e8a91c', '#b7c23f'];
  if (s.type === 'm') return ['#7a4c26', '#4a2c12', '#9a6a3c'];
  return splatColors(s).concat('#fff');
}
function burst(wx, wy, cols, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = speed * (0.3 + Math.random());
    parts.push({ x: wx, y: wy, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.8, life: 0.35 + Math.random() * 0.35, max: 0.7, r: 0.6 + Math.random() * 1.4, col: cols[i % cols.length], drag: 3 });
  }
}
function bubbles(wx, wy) {
  parts.push({ x: wx + (Math.random() - .5) * 6, y: wy + (Math.random() - .5) * 5, vx: (Math.random() - .5) * 6, vy: -4 - Math.random() * 6, life: 0.5, max: 0.5, r: 0.7 + Math.random() * 1.2, col: 'rgba(255,255,255,.9)', drag: 1, ring: true });
}
function launch(c, to, type, onLand) {
  shots.push({ fx: c.x, fy: c.y - 12, tx: to[0], ty: to[1], t: 0, dur: 0.55 + Math.hypot(to[0] - c.x, to[1] - c.y) / 220, type, onLand, spin: Math.random() * TAU });
}
function launchIncoming(s, grp) {
  const e = chars.enemy, [wx, wy] = toWorld(s.side, s.x, s.y);
  e.throwT = 0.3; e.dir = 'down'; e.still = 0;
  launch(e, [wx, wy], s.type, () => {
    grp.landed = true;
    for (const q of grp.list) { incoming.delete(q.id); G.splats.set(q.id, q); }
    burst(wx, wy, burstCols(s), 14 + grp.list.length * 6, 50 + grp.list.length * 6); shake = 0.25; sfx('splat');
  });
}
function enemyCleaned(s) {
  const [wx, wy] = toWorld(s.side, s.x, s.y);
  for (let i = 0; i < 6; i++) bubbles(wx, wy);
  chars.enemy.tx = clamp(wx, 6, W - 6); chars.enemy.ty = clamp(wy + 2, 6, HALF - 6); chars.enemy.scrub = 0.8;
}
function throwAt(wx, wy) {
  const p = G.players[me], enemy = other(me);
  if (!p || cooldown > 0) return;
  if (p.ammo[sel] <= 0) { toast('Bitti!', ITEMS[sel].name + ' kalmadı'); sfx('no'); return; }
  if (dirtyCount(enemy) + shots.length >= MAXSPLAT) { toast('Yeter!', 'Karşı taraf zaten leş gibi'); return; }
  const type = sel, L = lv(p).L, c = chars.me;
  p.ammo[type]--; cooldown = 0.4; c.throwT = 0.3; c.dir = 'up'; c.still = 0;
  wx = clamp(wx + (Math.random() - .5) * 5, 5, W - 5); wy = clamp(wy + (Math.random() - .5) * 5, 5, HALF - 5);
  be.savePlayer(me); sfx('throw');
  launch(c, [wx, wy], type, () => {
    const [lx, ly] = toLocal(enemy, wx, wy), it = ITEMS[type];
    const es = baseScale(lv(G.players[enemy]).L);
    const hit = Math.abs(lx - 50) < 16 * es && Math.abs(ly - 66) < 8 * es;
    const n = blobCount(L, type), gid = rid(), r0 = Math.min(22, it.r * (1 + 0.06 * (L - 1)) * (hit ? 1.2 : 1));
    let first = null;
    for (let i = 0; i < n; i++) {
      let bx = lx, by = ly, r = r0;
      if (i) {
        const a = Math.random() * TAU, d = r0 * (0.9 + Math.random() * 0.9);
        bx = clamp(lx + Math.cos(a) * d, 3, 97); by = clamp(ly + Math.sin(a) * d * 0.8, 3, 82); r = r0 * (0.5 + Math.random() * 0.3);
      }
      const s = { side: enemy, x: +bx.toFixed(1), y: +by.toFixed(1), r: +r.toFixed(1), type, seed: (Math.random() * 1e9) | 0, by: myUid, at: Date.now(), g: gid, lv: L };
      be.addSplat(s); first = first || s;
    }
    burst(wx, wy, burstCols(first), 16 + n * 6, 50 + n * 6); shake = 0.3; sfx('splat');
    const gain = Math.round(it.xp * (1 + 0.15 * (L - 1)) * (hit ? 1.5 : 1));

}
function addXp(p, gain) {
  const before = lv(p).L;
  p.xp += gain;
  const after = lv(p).L;
  if (after > before) {
    for (const k of ORDER) p.ammo[k] = Math.max(p.ammo[k], cap(k, after));
    const fresh = ORDER.filter(k => ITEMS[k].unlock > before && ITEMS[k].unlock <= after).map(k => ITEMS[k].name);
    const more = blobCount(after, 't') > blobCount(before, 't');
    toast('Seviye ' + after + '!', fresh.length ? 'Yeni: ' + fresh.join(', ') : more ? 'Artık daha çok pislik saçıyorsun' : 'Envanter ve üs büyüdü');
    sfx('level');
    const [bx, by] = toWorld(me, 50, 66);
    burst(bx, by - 6, [TEAM[me].light, '#fff', '#ffc73a'], 40, 70);
  }
  be.savePlayer(me);
}

/* ---------- Girdi ---------- */
function ptrWorld(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left - ox) / sc, (e.clientY - r.top - oy) / sc];
}
const setTarget = (wx, wy) => { chars.me.tx = clamp(wx, 5, W - 5); chars.me.ty = clamp(wy + 1.5, HALF + 6, H - 3); };
cv.addEventListener('pointerdown', e => {
  audioInit();
  if (!started || !canPlay) return;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const [wx, wy] = ptrWorld(e);
  ptr.down = true; ptr.x = wx; ptr.y = wy;
  if (wy < HALF) {
    if (dirtyCount(me) > 0) { nudgeBanner(); sfx('no'); ptr.aiming = false; }
    else ptr.aiming = true;
  } else { ptr.aiming = false; setTarget(wx, wy); }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.down) return;
  const [wx, wy] = ptrWorld(e);
  ptr.x = wx; ptr.y = wy;
  if (!ptr.aiming) setTarget(wx, wy);
});
cv.addEventListener('pointerup', () => {
  if (ptr.down && ptr.aiming && ptr.y < HALF + 4 && dirtyCount(me) === 0) throwAt(ptr.x, Math.min(ptr.y, HALF - 5));
  ptr.down = false; ptr.aiming = false;
});
cv.addEventListener('pointercancel', () => { ptr.down = false; ptr.aiming = false; });

/* ---------- Güncelleme ---------- */
const dirOf = (dx, dy) => (Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up');
function moveChar(c, dt, speed) {
  const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
  c.moving = d > 0.8;
  if (c.moving) {
    const step = Math.min(d, speed * dt);
    c.x += dx / d * step; c.y += dy / d * step;
    if (c.throwT <= 0) c.dir = dirOf(dx, dy);
    c.walk += dt * 12; c.still = 0;
  } else {
    c.still += dt;
    if (c.still > 0.7 && c.scrub <= 0) c.dir = c.home;
  }
  if (c.throwT > 0) c.throwT -= dt;
}
function update(dt) {
  time += dt;
  if (cooldown > 0) cooldown -= dt;
  if (shake > 0) shake -= dt;
  const c = chars.me, e = chars.enemy;
  moveChar(c, dt, 75);
  moveChar(e, dt, 45);

  // Temizlik: parmak basılıyken karakterin yakınındaki lekeyi ov
  c.scrub = Math.max(0, c.scrub - dt);
  if (started && canPlay && ptr.down && !ptr.aiming) {
    let best = null, bd = 1e9;
    for (const s of G.splats.values()) {
      if (s.side !== me) continue;
      const [wx, wy] = toWorld(s.side, s.x, s.y), d = Math.hypot(wx - c.x, wy - c.y) - s.r * 0.7;
      if (d < 7 && d < bd) { bd = d; best = s; best._w = [wx, wy]; }
    }
    if (best) {
      if (best._hp === undefined) best._hp = 1;
      best._hp -= dt / (0.3 + best.r * 0.06);
      c.scrub = 0.15; c.still = 0;
      if (!c.moving) { const dx = best._w[0] - c.x, dy = best._w[1] - c.y; c.dir = Math.hypot(dx, dy) < 2 ? 'down' : dirOf(dx, dy); }
      if (Math.random() < dt * 28) bubbles(best._w[0], best._w[1]);
      if (Math.random() < dt * 9) sfx('scrub');
      if (best._hp <= 0) {
        be.delSplat(best.id);
        for (let i = 0; i < 8; i++) bubbles(best._w[0], best._w[1]);
        const p = G.players[me]; p.cleaned = (p.cleaned || 0) + 1; be.savePlayer(me); sfx('clean');
        if (dirtyCount(me) === 0) toast('Tertemiz!', 'Şimdi saldırı sırası sende');
      }
    }
  }
  if (e.scrub > 0) e.scrub -= dt;
  e.idle -= dt;
  if (e.idle <= 0 && e.scrub <= 0) { e.idle = 2.5 + Math.random() * 3; e.tx = 28 + Math.random() * 44; e.ty = HALF - 36 - Math.random() * 12; }

  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i]; s.t += dt / s.dur;
    if (s.t >= 1) { shots.splice(i, 1); s.onLand(); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt;
  }
}

/* ---------- Karakter çizimi: kartlara göre ön / arka / yan ---------- */
function fig(g, key, dir, a) {
  const d = CH[key], isCap = key === 'cap', w = d.w, hw = w / 2;
  const sw = a.moving ? Math.sin(a.walk) : 0, bob = a.moving ? Math.abs(sw) * 0.35 : Math.sin(a.t * 3) * 0.12;
  const th = a.throwT > 0 ? Math.sin((1 - a.throwT / 0.3) * Math.PI) : 0, scrub = a.scrub > 0, m = Math.sin(a.t * 24) * 1.6;
  const S = lw => { g.lineWidth = lw || 0.42; g.strokeStyle = INK; g.stroke(); };
  const F = c => { g.fillStyle = c; g.fill(); };
  const E = (x, y, rx, ry, c, lw) => { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); F(c); S(lw); };
  const R = (x, y, ww, h, r, c, lw) => { rr(x, y, ww, h, r, g); F(c); S(lw); };
  const mop = (x1, y1, x2, y2) => {
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineWidth = 0.7; g.strokeStyle = '#8a5a2b'; g.stroke();
    R(x2 - 2.7, y2 - 0.9, 5.4, 1.9, 0.7, '#e6eef5', 0.35);
  };
  const rx = isCap ? 2.9 : 3.3, ry = isCap ? 3.1 : 3.2, hy = -14.6, HAIR = '#2e1f17', CAPC = '#232327';
  const shades = (x, y, ww) => { R(x, y, ww, 1.2, 0.45, '#0d0e14', 0.3); g.fillStyle = 'rgba(150,170,220,.6)'; g.fillRect(x + 0.35, y + 0.25, ww * 0.3, 0.25); };
  g.save(); g.lineJoin = 'round'; g.lineCap = 'round';
  if (dir === 'left') g.scale(-1, 1);

  if (dir === 'up' || dir === 'down') {
    const back = dir === 'up', lw_ = w * 0.4;
    if (scrub && back) mop(hw * 0.3, -8, hw + 2.8 + m, -3.4);
    for (const sg of [-1, 1]) { // bacaklar + ayakkabılar
      const lift = Math.max(0, sg * sw) * 0.9, x = sg < 0 ? -lw_ - 0.1 : 0.1;
      R(x, -6.4, lw_, 5.3 - lift, 0.6, d.pants);
      if (!isCap) { rr(sg < 0 ? x + 0.25 : x + lw_ - 1.45, -4.7, 1.2, 1.6, 0.2, g); S(0.25); }
      E(x + lw_ / 2, -0.75 - lift, lw_ / 2 + 0.35, 0.95, d.shoe, 0.35);
    }
    g.translate(0, -bob);
    if (!isCap) R(back ? -hw - 1.0 : hw - 0.7, -8.3, 1.8, 2.6, 0.5, '#2a2a2e', 0.35); // çanta
    const arm = (sg, raise, watch) => {
      const x = sg * (hw + 0.35) - 0.8, dy = sg * sw * 0.5;
      if (raise > 0.05) {
        R(x + 0.15, -11.2 - raise * 4.6, 1.3, 1.4 + raise * 4.6, 0.6, d.skin, 0.35);
        E(x + 0.8, -11.4 - raise * 4.8, 0.95, 0.95, d.skin, 0.35);
        R(x - 0.1, -11.5, 1.8, 2.3, 0.7, d.tee, 0.35);
        return [x + 0.8, -11.4 - raise * 4.8];
      }
      const up = scrub ? -1.2 : 0;
      R(x + 0.15, -9.6 + dy + up, 1.3, 3.2, 0.6, d.skin, 0.35);
      if (watch) { g.fillStyle = '#111'; g.fillRect(x + 0.1, -7.5 + dy + up, 1.4, 0.6); }
      E(x + 0.8, -6.2 + dy + up, 0.9, 0.9, d.skin, 0.35);
      R(x - 0.1, -11.4, 1.8, 2.6, 0.7, d.tee, 0.35);
      return [x + 0.8, -6.2 + dy + up];
    };
    const hr = back ? 1 : -1;
    const hand = arm(hr, scrub ? 0 : th, false); arm(-hr, 0, !isCap);
    R(-hw, -11.7, w, 6.3, 1.7, d.tee); // tişört
    if (!isCap) {
      g.beginPath();
      if (back) { g.moveTo(hw - 0.7, -11.2); g.lineTo(-hw + 0.4, -6.6); } else { g.moveTo(-hw + 0.7, -11.2); g.lineTo(hw - 0.4, -6.6); }
      g.lineWidth = 0.9; g.strokeStyle = '#46464c'; g.stroke();
      if (!back) { g.beginPath(); g.arc(1.1, -9.3, 0.95, Math.PI, TAU); g.closePath(); F('#e8672a'); g.fillStyle = '#f2b23a'; g.fillRect(0.1, -9.1, 2, 0.3); }
    }
    if (a.hold && th < 0.05 && !scrub) E(hand[0], hand[1] - 0.2, 1.25, 1.25, ITEMS[a.hold].col, 0.3);
    R(-0.9, hy + ry - 0.9, 1.8, 1.7, 0.4, d.skin, 0.35); // boyun
    E(-rx + 0.1, hy + 0.4, 0.75, 0.9, d.skin, 0.35); E(rx - 0.1, hy + 0.4, 0.75, 0.9, d.skin, 0.35); // kulaklar
    E(0, hy, rx, ry, d.skin);
    if (!back) {
      if (isCap) { // sakal
        g.save(); g.beginPath(); g.ellipse(0, hy, rx - 0.2, ry - 0.2, 0, 0, TAU); g.clip();
        g.fillStyle = '#6b4a2a'; g.fillRect(-4, hy + 0.9, 8, 4);
        g.fillStyle = d.skin; g.beginPath(); g.ellipse(0, hy + 0.9, 1.5, 0.85, 0, 0, TAU); g.fill();
        g.restore();
        g.beginPath(); g.moveTo(-0.7, hy + 2.05); g.lineTo(0.7, hy + 2.05); S(0.35);
      } else { g.beginPath(); g.arc(0, hy + 1.15, 1.3, 0.3, Math.PI - 0.3); S(0.35); }
      for (const sg of [-1, 1]) { E(sg * 1.02, hy - 0.5, 1.08, 1.08, '#fff', 0.35); g.beginPath(); g.arc(sg * 0.85, hy - 0.4, 0.24, 0, TAU); F(INK); }
      g.beginPath(); g.ellipse(0.15, hy + 0.75, 0.6, 0.42, 0, 0, TAU); F(d.skin); S(0.3);
      if (isCap) { // ters şapka: önde ayar bandı, üstte güneş gözlüğü
        g.beginPath(); g.ellipse(0, hy - 1.4, rx + 0.3, 2.3, 0, Math.PI, TAU); g.closePath(); F(CAPC); S();
        g.beginPath(); g.ellipse(0, hy - 1.4, 1.25, 0.8, 0, Math.PI, TAU); g.closePath(); F(d.skin); S(0.3);
        R(-1.35, hy - 1.95, 2.7, 0.5, 0.2, '#47474d', 0.25);
        shades(-2.3, hy - 4.5, 2.1); shades(0.2, hy - 4.5, 2.1);
      } else { // dağınık saç
        g.beginPath();
        for (let i = 0; i <= 9; i++) {
          const an = Math.PI + 0.1 + (Math.PI - 0.2) * i / 9, rad = i % 2 ? 1.0 : 0.25, x = Math.cos(an) * (rx + rad), y = hy - 0.4 + Math.sin(an) * (ry + rad * 1.1);
          i ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        for (const [x, y] of [[2.6, -2.0], [1.6, -1.6], [0.8, -2.4], [-0.1, -1.7], [-1.0, -2.5], [-1.9, -1.7], [-2.9, -2.0]]) g.lineTo(x, hy + y);
        g.closePath(); F(HAIR); S();
      }
    } else if (isCap) { // arkadan: kubbe + enseye inen siper
      g.beginPath(); g.ellipse(0, hy + 1.3, rx - 0.5, 1.5, 0, 0, Math.PI); F('#3a2a1c');
      E(0, hy - 0.5, rx + 0.3, 2.9, CAPC);
      R(-2.0, hy + 1.2, 4.0, 1.9, 0.9, '#2e2e33');
      g.beginPath(); g.moveTo(0, hy - 3.3); g.lineTo(0, hy + 1.2); g.lineWidth = 0.25; g.strokeStyle = '#45454b'; g.stroke();
      shades(-2.3, hy - 4.4, 2.1); shades(0.2, hy - 4.4, 2.1);
    } else {
      g.beginPath();
      for (let i = 0; i < 16; i++) {
        const an = TAU * i / 16 - Math.PI / 2, lo = Math.sin(an) > 0.4 ? 0.45 : 1, rad = (i % 2 ? 0.2 : 1.05) * lo, x = Math.cos(an) * (rx + rad), y = hy - 0.3 + Math.sin(an) * (ry + rad);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath(); F(HAIR); S();
    }
    if (scrub && !back) mop(0, -7.6 + bob, m, 2.4 + bob);
  } else { // yan görünüş (sağa bakar; sol için aynalanır)
    const bw = w * 0.62;
    for (const sg of [-1, 1]) {
      const off = sg * sw * 1.5;
      R(-1.0 + off, -6.4, 2.0, 5.3, 0.6, d.pants);
      E(0.35 + off, -0.75, 1.65, 0.95, d.shoe, 0.35);
    }
    g.translate(0, -bob);
    if (!isCap) R(-bw / 2 - 1.3, -8.4, 1.9, 2.7, 0.5, '#2a2a2e', 0.35);
    R(-bw / 2, -11.7, bw, 6.3, 1.7, d.tee);
    if (!isCap) { g.beginPath(); g.moveTo(-bw / 2 + 0.5, -11.0); g.lineTo(-bw / 2 + 0.3, -7.4); g.lineWidth = 0.9; g.strokeStyle = '#46464c'; g.stroke(); }
    g.save(); g.translate(0.1, -10.9); g.rotate(scrub ? -0.9 : th > 0.05 ? -th * 2.5 : sw * 0.5);
    R(-0.7, 1.5, 1.4, 3.2, 0.6, d.skin, 0.35); E(0, 4.9, 0.9, 0.9, d.skin, 0.35); R(-0.95, -0.5, 1.9, 2.6, 0.7, d.tee, 0.35);

let ac = null, muted = false;
try { muted = localStorage.getItem(LS + '-mute') === '1'; } catch (e) {}
function audioInit() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }
function tone(f, d, type, vol, slide, delay) {
  const t0 = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
function sfx(n) {
  if (!ac || muted) return;
  try {
    if (n === 'throw') tone(300, 0.18, 'sine', 0.12, 700);
    else if (n === 'splat') { tone(170, 0.22, 'sawtooth', 0.14, 45); tone(90, 0.25, 'square', 0.08, 40); }
    else if (n === 'scrub') tone(900 + Math.random() * 500, 0.05, 'triangle', 0.03);
    else if (n === 'clean') { tone(700, 0.1, 'sine', 0.1); tone(1050, 0.14, 'sine', 0.1, 0, 0.08); }
    else if (n === 'no') tone(150, 0.15, 'square', 0.06, 110);
    else if (n === 'level') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.12, 0, i * 0.09));
  } catch (e) {}
}

/* ---------- Arayüz ---------- */
const itemsEl = $('items'), bannerEl = $('banner'), toastEl = $('toast'), modalEl = $('modal');
for (const k of ORDER) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'item'; b.id = 'item-' + k;
  b.innerHTML = '<span class="dot" style="background:' + ITEMS[k].col + '"></span><span class="nm"></span><span class="ct"></span>';
  b.addEventListener('click', () => {
    audioInit();
    const p = G.players[me];
    if (!p || lv(p).L < ITEMS[k].unlock) { toast('Kilitli', ITEMS[k].name + ' ' + ITEMS[k].unlock + '. seviyede açılır'); return; }
    sel = k; hud();
  });
  itemsEl.append(b);
}
function toast(big, small) {
  toastEl.hidden = false; toastEl.textContent = big;
  if (small) { const s = document.createElement('small'); s.textContent = small; toastEl.append(s); }
  toastEl.style.animation = 'none'; void toastEl.offsetWidth; toastEl.style.animation = '';
}
function nudgeBanner() { bannerEl.classList.remove('shake'); void bannerEl.offsetWidth; bannerEl.classList.add('shake'); }
function hud() {
  const p = G.players[me], en = other(me), ep = G.players[en], li = lv(p), L = li.L;
  regen(p);
  $('lvLabel').textContent = nameOf(me) + ' · Sv ' + L;
  $('xpBar').firstElementChild.style.width = (li.into / li.need * 100).toFixed(1) + '%';
  $('xpText').textContent = li.into + ' / ' + li.need;
  for (const k of ORDER) {
    const b = $('item-' + k), locked = L < ITEMS[k].unlock, n = p ? p.ammo[k] : 0;
    b.classList.toggle('locked', locked); b.classList.toggle('sel', k === sel && !locked); b.classList.toggle('empty', !locked && n === 0);
    b.children[1].textContent = ITEMS[k].short || ITEMS[k].name;
    b.children[2].textContent = locked ? 'Sv ' + ITEMS[k].unlock : n + '/' + cap(k, L);
  }
  const chip = $('enemyChip'); chip.textContent = '';
  const sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = TEAM[en].main;
  const nb = document.createElement('b'); nb.textContent = ep ? nameOf(en) : 'Rakip';
  const stx = document.createElement('span'); stx.textContent = ep ? 'Sv ' + lv(ep).L + ' · leke ' + dirtyCount(en) : 'bekleniyor';
  chip.append(sw, nb, stx);
  if (online && ep && onl[ep.uid]) { const lvn = document.createElement('span'); lvn.className = 'live'; lvn.title = 'çevrimiçi'; chip.append(lvn); }
  const dirty = dirtyCount(me);
  let txt, warn = false;
  if (!ready) txt = 'Yükleniyor…';
  else if (!canPlay) txt = 'İzleyicisin';
  else if (dirty > 0) { txt = 'Önce temizle! Leke: ' + dirty; warn = true; }
  else txt = 'Karşı tarafa dokun, nişanla, bırak';
  bannerEl.textContent = txt; bannerEl.classList.toggle('warn', warn);
  $('passBtn').hidden = online || !started;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function showModal(html) {
  modalEl.innerHTML = '<div class="card">' + html + '</div>'; modalEl.hidden = false;
  for (const c of modalEl.querySelectorAll('canvas[data-fig]')) {
    const g = c.getContext('2d'), k = 2;
    c.width = 84 * k; c.height = 104 * k;
    g.setTransform(k * 4.6, 0, 0, k * 4.6, k * 42, k * 97);
    g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.ellipse(0, 0, 5, 1.6, 0, 0, TAU); g.fill();
    fig(g, c.dataset.fig, 'down', { walk: 0, moving: false, throwT: 0, scrub: 0, t: 0 });
  }
}
function formHtml(side) {
  const p = G.players[side], cur = p && CH[p.ch] ? p.ch : (CH[(G.players[other(side)] || {}).ch] ? (G.players[other(side)].ch === 'cap' ? 'hair' : 'cap') : chOf(side));
  return '<label class="field" for="nameIn">Adın<input id="nameIn" type="text" maxlength="12" autocomplete="off" placeholder="' + TEAM[side].name + ' oyuncu" value="' + esc((p && p.name) || '') + '"></label>' +
    '<div class="field">Karakterini seç</div><div class="pick">' +
    Object.keys(CH).map(k => '<button type="button" class="pc' + (k === cur ? ' sel' : '') + '" data-ch="' + k + '"><canvas data-fig="' + k + '"></canvas>' + CH[k].label + '</button>').join('') + '</div>';
}
function readForm(side) {
  const p = G.players[side], inp = $('nameIn'), pick = modalEl.querySelector('.pc.sel');
  if (!p || !inp) return;
  p.name = inp.value.trim().slice(0, 12); if (pick) p.ch = pick.dataset.ch;
  be.savePlayer(side);
}
function shareHtml() {
  if (!online) return '';
  return '<div class="share"><input id="roomLink" type="text" readonly aria-label="Oda linki" value="' + esc(location.href) + '"><button class="btn" type="button" data-act="copy">Linki kopyala</button></div>';
}
function startCard() {
  let modeLine, bad = noteBad;
  if (!ready) modeLine = '<span id="bootNote">' + esc(bootStage) + '</span>';
  else if (online) modeLine = canPlay ? 'Çevrimiçi oda: <b>' + TEAM[me].name + '</b> takımdasın. ' + (G.players[other(me)] ? 'Rakibin: <b>' + esc(nameOf(other(me))) + '</b>' + (onl[G.players[other(me)].uid] ? ' (şu an çevrimiçi).' : '.') : 'Rakibin henüz girmedi. Aşağıdaki linki ona gönder.') : esc(note);
  else modeLine = (note ? esc(note) + ' ' : '') + 'Tek telefon modu: sırayla oynayın, "Telefonu ver" ile oyuncu değişir.';
  showModal(
    '<h1>Domates Savaşı</h1>' +
    (ready && canPlay ? formHtml(me) : '') +
    '<ul><li>Karşı tarafa dokun, nişan al, bırakınca fırlat.</li>' +
    '<li>Avlun kirliyse önce temizle: lekeye basılı tut.</li>' +
    '<li>Pislettikçe seviye atlar, daha çok pislik saçarsın.</li></ul>' +
    '<p class="note' + (bad ? ' bad' : '') + '">' + modeLine + '</p>' + shareHtml() +
    '<p id="errLine" class="note bad"' + (lastErr ? '' : ' hidden') + '>' + (lastErr ? 'Hata: ' + esc(lastErr) : '') + '</p>' +
    '<div class="row"><button class="btn primary" type="button" data-act="start"' + (ready ? '' : ' disabled') + '>' + (ready ? (started ? 'Devam et' : 'Başla') : 'Bağlanıyor…') + '</button>' +
    (ready ? '' : '<button class="btn" type="button" data-act="solo">Beklemeden tek telefonda dene</button>') + '</div>');
}
function menuCard(confirmReset) {
  showModal(
    '<h2>Menü</h2>' +
    '<p>' + (online ? 'Çevrimiçi oda ' + esc(room) + ' · ' + (canPlay ? TEAM[me].name + ' takım' : 'izleyici') + ' · sunucu ' + netBE.connected() + '/' + netBE.total() : 'Tek telefon modu · sıra ' + esc(nameOf(me)) + ' oyuncuda') + '</p>' + shareHtml() +
    '<div class="row"><button class="btn" type="button" data-act="help">İsim ve karakter</button>' +
    '<button class="btn" type="button" data-act="mute">Ses: ' + (muted ? 'kapalı' : 'açık') + '</button></div>' +
    (canPlay ? (confirmReset
      ? '<p class="note">İki oyuncunun da seviyesi, envanteri ve tüm lekeler silinecek.</p><div class="row"><button class="btn danger" type="button" data-act="reset-yes">Evet, sıfırla</button><button class="btn" type="button" data-act="menu">Vazgeç</button></div>'
      : '<div class="row"><button class="btn" type="button" data-act="reset">Oyunu sıfırla</button></div>') : '') +
    '<div class="row"><button class="btn primary" type="button" data-act="close">Oyuna dön</button></div>');
}
function passCard() {
  const next = other(me);
  showModal('<h2>Telefonu ' + esc(nameOf(next)) + ' oyuncuya ver</h2>' + formHtml(next) +
    '<p class="note">Avlunda leke varsa önce onları temizlemen gerekecek.</p>' +
    '<div class="row"><button class="btn primary" type="button" data-act="pass-go">Hazırım</button></div>');
}
modalEl.addEventListener('click', e => {
  const pc = e.target.closest('.pc');
  if (pc) { for (const o of modalEl.querySelectorAll('.pc')) o.classList.toggle('sel', o === pc); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  audioInit();
  const a = b.dataset.act;
  if (a === 'start') { if (canPlay) readForm(me); started = true; modalEl.hidden = true; hud(); }
  else if (a === 'copy') {
    const inp = $('roomLink'), done = () => { b.textContent = 'Kopyalandı'; };
    const fallback = () => { try { inp.focus(); inp.select(); inp.setSelectionRange(0, 9999); if (document.execCommand('copy')) done(); } catch (err) {} };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(inp.value).then(done, fallback); else fallback();
  }
  else if (a === 'solo') { if (!ready) { bootAbort = true; if (netBE) netBE.close(); useLocal('Tek telefonda deneme modundasın. Çevrimiçi oyun için sayfayı yenile.'); finishBoot(); } }
  else if (a === 'close') { modalEl.hidden = true; hud(); }
  else if (a === 'help') startCard();
  else if (a === 'menu') menuCard(false);
  else if (a === 'mute') { muted = !muted; try { localStorage.setItem(LS + '-mute', muted ? '1' : '0'); } catch (err) {} menuCard(false); }
  else if (a === 'reset') menuCard(true);
  else if (a === 'reset-yes') { be.reset(); sel = 't'; shots.length = 0; modalEl.hidden = true; toast('Oyun sıfırlandı'); hud(); }
  else if (a === 'pass-go') { const next = other(me); readForm(next); me = next; view = me; sel = 't'; resetChars(); shots.length = 0; parts.length = 0; modalEl.hidden = true; hud(); }
});
$('menuBtn').addEventListener('click', () => menuCard(false));
$('passBtn').addEventListener('click', () => { if (!shots.length) passCard(); });

/* ---------- Açılış ---------- */
function useLocal(msg, bad) {
  online = false; note = msg || ''; noteBad = !!bad; G.splats.clear(); G.players = { A: null, B: null };
  be = localBE; be.init(); ready = true;
}
const CANCEL = {};
let bootAbort = false, bootStage = 'Bağlanıyor…', lastErr = '';
function st(t) {
  if (bootAbort) throw CANCEL;
  bootStage = t;
  const el = $('bootNote'); if (el && !ready) el.textContent = t;
}
function showErr(m) {
  lastErr = String(m || 'bilinmeyen hata').slice(0, 160);
  const el = $('errLine'); if (el) { el.textContent = 'Hata: ' + lastErr; el.hidden = false; }
}
window.addEventListener('error', e => showErr(e.message));
window.addEventListener('unhandledrejection', e => showErr(e.reason && (e.reason.code || e.reason.message) || e.reason));
function finishBoot() {
  regen(G.players[me]);
  resetChars();
  if (!started) startCard();
  hud();
}
async function boot() {
  try {
    if (window.mqtt) {
      const m = /^#([a-z0-9]{4,16})$/.exec(location.hash);
      room = m ? m[1] : '';
      if (!room) {
        room = Math.random().toString(36).slice(2, 8).padEnd(6, 'x');
        try { history.replaceState(null, '', '#' + room); } catch (e) { location.hash = room; }
      }
      try { myUid = localStorage.getItem(LS + '-uid') || ''; if (!myUid) { myUid = 'u' + rid(); localStorage.setItem(LS + '-uid', myUid); } } catch (e) { myUid = 'u' + rid(); }
      let urls = BROKERS;
      if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { const b = new URLSearchParams(location.search).get('b'); if (b) urls = [b]; }
      st('Oyun sunucusuna bağlanılıyor…');
      netBE = makeNetBE(room, urls);
      await netBE.init();
      if (bootAbort) return;
      be = netBE; online = true; ready = true;
      document.addEventListener('visibilitychange', () => { if (document.hidden) netBE.flush(); });
    } else useLocal('Çevrimiçi bağlantı kitaplığı yüklenemedi.', true);
  } catch (e) {
    if (e === CANCEL || bootAbort) return;
    useLocal('Çevrimiçi oyuna bağlanılamadı (' + ((e && (e.code || e.message)) || 'bilinmeyen hata') + '). Sayfayı yenileyip tekrar dene.', true);
  }
  finishBoot();
}
window.addEventListener('hashchange', () => location.reload());

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); startCard(); hud();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
setInterval(hud, 300);
requestAnimationFrame(frame);
boot();
})();
</script>
</body>
</html>
