<title>Domates Savaşı</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Yerleşim: tam ekran çim saha; üstte ince rakip şeridi, altta envanter paneli, ortada tuval. Tek tema (oyun dünyası). */
:root {
  color-scheme: dark;
  --grass: #5fa644;
  --grass-deep: #3f7d2e;
  --ink: #17240f;
  --panel: rgba(20, 34, 14, .82);
  --paper: #fff8e6;
  --tomato: #e5372b;
  --sun: #ffc73a;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--grass);
  color: var(--paper);
  font-family: var(--body);
  font-weight: 600;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

.bar {
  position: absolute; left: 0; right: 0; z-index: 2;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
#top { top: 0; padding-block: 8px; display: flex; gap: 8px; align-items: center; }
#bottom { bottom: 0; padding-block: 8px; display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }

.chip {
  background: var(--panel); border-radius: 999px; padding: 6px 12px;
  font-size: 13px; display: flex; gap: 8px; align-items: center; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip b { font-family: var(--display); font-weight: 800; font-size: 15px; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }

button {
  font: inherit; color: inherit; border: 0; cursor: pointer;
  -webkit-user-select: none; user-select: none;
}
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.btn {
  background: var(--panel); border-radius: 999px; padding: 8px 14px;
  font-family: var(--display); font-weight: 800; font-size: 14px; flex: none;
}
.btn.primary { background: var(--tomato); color: #fff; font-size: 18px; padding: 12px 24px; box-shadow: 0 4px 0 #9c1b13; }
.btn.primary:disabled { opacity: .6; }
.btn.ghost { background: rgba(255,255,255,.12); }
.btn.danger { background: #9c1b13; }

#banner {
  position: absolute; top: 52px; left: 50%; transform: translateX(-50%); z-index: 2;
  background: var(--panel); border-radius: 12px; padding: 6px 14px;
  font-family: var(--display); font-weight: 800; font-size: 13px; line-height: 1.3; text-align: center; white-space: nowrap;
  max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
#banner.warn { background: var(--tomato); color: #fff; }
#banner.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(calc(-50% - 6px)); } 75% { transform: translateX(calc(-50% + 6px)); } }

#toast {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 3;
  font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1.05; text-align: center;
  color: var(--sun); text-shadow: 0 3px 0 var(--ink), 0 0 18px rgba(0,0,0,.45);
  pointer-events: none; width: max-content; max-width: 90%;
  animation: pop 1.6s ease-out forwards;
}
#toast small { display: block; font-size: 16px; color: var(--paper); }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  25% { transform: translate(-50%, -50%) scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
}

#lvRow { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
#lvLabel { font-family: var(--display); font-weight: 800; font-size: 15px; white-space: nowrap; }
#xpBar { flex: 1; min-width: 0; height: 10px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; }
#xpBar i { display: block; height: 100%; width: 0; background: var(--sun); border-radius: 999px; transition: width .3s; }
#xpText { font-variant-numeric: tabular-nums; white-space: nowrap; opacity: .85; }

#items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.item {
  background: var(--panel); border-radius: 14px; padding: 7px 4px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 2px solid transparent; min-width: 0;
}
.item .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset -3px -3px 0 rgba(0,0,0,.22); }
.item .nm { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.item .ct { font-family: var(--display); font-weight: 800; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums; }
.item.sel { border-color: var(--sun); background: rgba(50, 70, 20, .92); }
.item.locked { opacity: .5; }
.item.empty .ct { color: #ff9b93; }

#modal {
  position: absolute; inset: 0; z-index: 5; background: rgba(15, 28, 10, .72);
  display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.card {
  background: var(--paper); color: var(--ink); border-radius: 22px; padding: 22px 20px 20px;
  width: 100%; max-width: 380px; max-height: 100%; overflow: auto;
  display: flex; flex-direction: column; gap: 12px; text-align: center;
  box-shadow: 0 10px 0 rgba(0,0,0,.25);
}
.card h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1; color: var(--tomato); text-wrap: balance; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; font-size: 15px; line-height: 1.45; }
.card ul { margin: 0; padding-left: 20px; text-align: left; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; gap: 4px; }
.card .note { font-size: 13px; background: #f3e6bf; border-radius: 10px; padding: 8px 10px; }
.card .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.card .btn.ghost { background: #e9dcb4; color: var(--ink); }
.card .btn.danger { color: #fff; }
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <header id="top" class="bar">
    <div id="enemyChip" class="chip"></div>
    <div class="grow"></div>
    <button id="passBtn" class="btn" type="button" hidden>Telefonu ver</button>
    <button id="menuBtn" class="btn" type="button">Menü</button>
  </header>

  <div id="banner">Yükleniyor…</div>
  <div id="toast" hidden></div>

  <footer id="bottom" class="bar">
    <div id="lvRow"><span id="lvLabel">Seviye 1</span><div id="xpBar"><i></i></div><span id="xpText">0 / 60</span></div>
    <div id="items"></div>
  </footer>

  <div id="modal"></div>
</div>

<script>
(() => {
'use strict';

/* ---------- Sabitler ---------- */
const W = 100, H = 170, HALF = 85, TICK = 20000, MAXSPLAT = 40, TAU = Math.PI * 2;
const ITEMS = {
  t: { name: 'Domates',       r: 7,  xp: 10, unlock: 1, cap0: 50, capStep: 10, every: 1,  col: '#e5372b', dark: '#9c1b13' },
  e: { name: 'Çürük yumurta', r: 9,  xp: 18, unlock: 2, cap0: 10, capStep: 5,  every: 3,  col: '#efe9c0', dark: '#b9b077' },
  m: { name: 'Çamur topu',    r: 12, xp: 30, unlock: 4, cap0: 6,  capStep: 3,  every: 6,  col: '#6b4423', dark: '#452b14' },
  p: { name: 'Boya balonu',   r: 15, xp: 50, unlock: 6, cap0: 4,  capStep: 2,  every: 10, col: '#a44be0', dark: '#6c2a9c' },
};
const ORDER = ['t', 'e', 'm', 'p'];
const PAINT = [['#a44be0', '#6c2a9c'], ['#12b8c9', '#0a7783'], ['#ff5fa2', '#b8306b'], ['#ff8a1f', '#b85a08']];
const TEAM = {
  A: { main: '#f2a516', dark: '#b06f00', light: '#ffd063', name: 'Sarı' },
  B: { main: '#2f8fe0', dark: '#1a5c9e', light: '#7cc0f7', name: 'Mavi' },
};

/* ---------- Durum ---------- */
const G = { players: { A: null, B: null }, splats: new Map() };
let me = 'A', view = 'A', canPlay = false, online = false, started = false, ready = false;
let myUid = '', be = null, sel = 't', note = '';
const other = s => (s === 'A' ? 'B' : 'A');
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function levelInfo(xp) {
  let L = 1, need = 60;
  while (xp >= need) { xp -= need; L++; need = 60 + 40 * (L - 1); }
  return { L, into: xp, need };
}
const lv = p => levelInfo(p ? p.xp || 0 : 0);
const cap = (k, L) => (L < ITEMS[k].unlock ? 0 : ITEMS[k].cap0 + ITEMS[k].capStep * (L - ITEMS[k].unlock));
const baseScale = L => Math.min(1.7, 1 + 0.08 * (L - 1));
function newPlayer(uid, resetAt) {
  return { uid, xp: 0, ammo: { t: 50, e: 0, m: 0, p: 0 }, regenAt: Date.now(), tick: 0, cleaned: 0, resetAt: resetAt || 0 };
}
const plain = p => ({ uid: p.uid, xp: p.xp, ammo: { ...p.ammo }, regenAt: p.regenAt, tick: p.tick, cleaned: p.cleaned, resetAt: p.resetAt || 0 });

function regen(p) {
  if (!p) return;
  let n = Math.floor((Date.now() - p.regenAt) / TICK);
  if (n <= 0) return;
  p.regenAt += n * TICK;
  n = Math.min(n, 2000);
  const L = lv(p).L;
  for (let i = 0; i < n; i++) {
    p.tick++;
    for (const k of ORDER) if (L >= ITEMS[k].unlock && p.tick % ITEMS[k].every === 0 && p.ammo[k] < cap(k, L)) p.ammo[k]++;
  }
}
const dirtyCount = side => { let n = 0; for (const s of G.splats.values()) if (s.side === side) n++; return n; };

/* ---------- Depolama: yerel (tek telefon) ---------- */
const LS = 'domates-savasi-v1';
const localBE = {
  init() {
    try {
      const d = JSON.parse(localStorage.getItem(LS) || 'null');
      if (d && d.players) {
        G.players = d.players;
        for (const s of d.splats || []) G.splats.set(s.id, s);
      }
    } catch (e) {}
    if (!G.players.A) G.players.A = newPlayer('A');
    if (!G.players.B) G.players.B = newPlayer('B');
    myUid = 'local'; me = 'A'; view = 'A'; canPlay = true;
  },
  persist() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        players: { A: plain(G.players.A), B: plain(G.players.B) },
        splats: [...G.splats.values()].map(splatData).map((d, i) => ({ ...d, id: [...G.splats.keys()][i] })),
      }));
    } catch (e) {}
  },
  addSplat(s) { s.id = rid(); G.splats.set(s.id, s); this.persist(); },
  delSplat(id) { G.splats.delete(id); this.persist(); },
  savePlayer() { this.persist(); },
  reset() {
    G.splats.clear(); G.players.A = newPlayer('A'); G.players.B = newPlayer('B'); this.persist();
  },
};
const splatData = s => ({ side: s.side, x: s.x, y: s.y, r: s.r, type: s.type, seed: s.seed, by: s.by, at: s.at });

/* ---------- Depolama: çevrimiçi (iki telefon) ---------- */
function makeOnlineBE(db) {
  const localAdds = new Map(), localDels = new Map();
  let saveT = null, chain = Promise.resolve(), warned = false;
  const fail = () => { if (!warned) { warned = true; toast('Kaydedilemedi', 'Bağlantını kontrol et'); setTimeout(() => (warned = false), 8000); } };
  const flush = () => {
    clearTimeout(saveT); saveT = null;
    if (!canPlay || !G.players[me]) return;
    const d = plain(G.players[me]), path = 'players/' + me;
    chain = chain.then(() => db.doc(path).set(d)).catch(fail);
  };
  return {
    async init(user) {
      let uid = '';
      try { uid = user ? await user.id() : ''; } catch (e) {}
      if (!uid) {
        try { uid = localStorage.getItem(LS + '-uid') || ''; if (!uid) { uid = 'g' + rid(); localStorage.setItem(LS + '-uid', uid); } } catch (e) { uid = 'g' + rid(); }
      }
      myUid = uid;
      const [a, b] = await Promise.all([db.doc('players/A').get(), db.doc('players/B').get()]);
      const pa = a.exists ? a.data() : null, pb = b.exists ? b.data() : null;
      G.players.A = pa; G.players.B = pb;
      let claim = null;
      if (pa && pa.uid === uid) me = 'A';
      else if (pb && pb.uid === uid) me = 'B';
      else if (!pa) claim = 'A';
      else if (!pb) claim = 'B';
      else { me = 'A'; canPlay = false; note = 'Bu oyunda iki oyuncu da dolu. Şimdilik izleyicisin.'; }
      if (claim) {
        try {
          const p = newPlayer(uid, (pa || pb || {}).resetAt || 0);
          await db.doc('players/' + claim).set(p);
          G.players[claim] = p; me = claim;
        } catch (e) {
          me = 'A'; canPlay = false; claim = null;
          note = 'Bu oyuna yazma iznin yok. Oyunun sahibi seni e-postayla Editör olarak davet etmeli. Şimdilik izleyicisin.';
          view = me; this.subscribe(); return;
        }
      }
      if (claim || G.players[me] && G.players[me].uid === uid) canPlay = true;
      view = me;
      this.subscribe();
    },
    subscribe() {
      for (const side of ['A', 'B']) {
        db.doc('players/' + side).onSnapshot(snap => {
          const d = snap.exists ? snap.data() : null;
          if (side === me && canPlay) {
            const mine = G.players[me];
            if (d && mine && (d.resetAt || 0) > (mine.resetAt || 0)) { G.players[me] = d; toast('Oyun sıfırlandı'); }
          } else G.players[side] = d;
        }, () => {});
      }
      db.collection('splats').onSnapshot(snap => {
        const now = Date.now(), seen = new Set();
        for (const doc of snap.docs) {
          const id = doc.id; seen.add(id);
          if (G.splats.has(id) || incoming.has(id)) continue;
          if (localDels.has(id) && now - localDels.get(id) < 15000) continue;
          const s = { ...doc.data(), id };
          if (started && s.side === me && s.by !== myUid && now - s.at < 12000) launchIncoming(s);
          else G.splats.set(id, s);
        }
        for (const [id, s] of G.splats) {
          if (seen.has(id)) continue;
          if (localAdds.has(id) && now - localAdds.get(id) < 15000) continue;
          G.splats.delete(id);
          if (started && s.side !== me) enemyCleaned(s);
        }
      }, () => {});
    },
    addSplat(s) {
      s.id = rid(); G.splats.set(s.id, s); localAdds.set(s.id, Date.now());
      db.doc('splats/' + s.id).set(splatData(s)).catch(fail);
    },
    delSplat(id) {
      G.splats.delete(id); localDels.set(id, Date.now());
      db.doc('splats/' + id).delete().catch(fail);
    },
    savePlayer() { if (!saveT) saveT = setTimeout(flush, 600); },
    flush,
    reset() {
      const at = Date.now();
      for (const id of [...G.splats.keys()]) this.delSplat(id);
      for (const side of ['A', 'B']) {
        const p = G.players[side];
        if (!p) continue;
        G.players[side] = newPlayer(p.uid, at);
        const d = plain(G.players[side]);
        chain = chain.then(() => db.doc('players/' + side).set(d)).catch(fail);
      }
    },
  };
}

/* ---------- Tuval ve koordinatlar ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let cw = 0, ch = 0, dpr = 1, sc = 1, ox = 0, oy = 0;
function resize() {
  const r = cv.getBoundingClientRect();
  cw = r.width; ch = r.height; dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const topH = $('top').offsetHeight + 34, botH = $('bottom').offsetHeight + 4;
  sc = Math.max(0.5, Math.min(cw / W, (ch - topH - botH) / H));
  ox = (cw - W * sc) / 2; oy = topH + (ch - topH - botH - H * sc) / 2;
}
const toWorld = (side, x, y) => (side === view ? [x, HALF + y] : [W - x, HALF - y]);
const toLocal = (side, wx, wy) => (side === view ? [wx, wy - HALF] : [W - wx, HALF - wy]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ---------- Karakterler, mermiler, parçacıklar ---------- */
const chars = { me: null, enemy: null };
function resetChars() {
  chars.me = { x: 50, y: HALF + 46, tx: 50, ty: HALF + 46, ang: -Math.PI / 2, walk: 0, throwT: 0, scrub: 0, moving: false };
  chars.enemy = { x: 50, y: HALF - 46, tx: 50, ty: HALF - 46, ang: Math.PI / 2, walk: 0, throwT: 0, scrub: 0, moving: false, idle: 2 };
}
resetChars();
const shots = [], parts = [], incoming = new Map();
let shake = 0, cooldown = 0, time = 0;
const ptr = { down: false, x: 0, y: 0, aiming: false };
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function splatColors(s) {
  if (s.type === 'p') return PAINT[(s.seed >>> 3) % PAINT.length];
  return [ITEMS[s.type].col, ITEMS[s.type].dark];
}
function burst(wx, wy, cols, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = speed * (0.3 + Math.random());
    parts.push({ x: wx, y: wy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.35, max: 0.7, r: 0.6 + Math.random() * 1.4, col: cols[i % cols.length], drag: 3 });
  }
}
function bubbles(wx, wy) {
  parts.push({ x: wx + (Math.random() - .5) * 6, y: wy + (Math.random() - .5) * 6, vx: (Math.random() - .5) * 6, vy: -4 - Math.random() * 6, life: 0.5, max: 0.5, r: 0.7 + Math.random() * 1.2, col: 'rgba(255,255,255,.85)', drag: 1, ring: true });
}

function launch(from, to, type, onLand) {
  shots.push({ fx: from.x, fy: from.y, tx: to[0], ty: to[1], t: 0, dur: 0.55 + Math.hypot(to[0] - from.x, to[1] - from.y) / 220, type, onLand, spin: Math.random() * TAU });
}
function launchIncoming(s) {
  incoming.set(s.id, s);
  const e = chars.enemy, [wx, wy] = toWorld(s.side, s.x, s.y);
  e.throwT = 0.3; e.ang = Math.atan2(wy - e.y, wx - e.x);
  launch(e, [wx, wy], s.type, () => {
    incoming.delete(s.id); G.splats.set(s.id, s);
    burst(wx, wy, splatColors(s), 18, 50); shake = 0.25; sfx('splat');
  });
}
function enemyCleaned(s) {
  const [wx, wy] = toWorld(s.side, s.x, s.y);
  for (let i = 0; i < 6; i++) bubbles(wx, wy);
  chars.enemy.tx = clamp(wx, 6, W - 6); chars.enemy.ty = clamp(wy, 6, HALF - 6); chars.enemy.scrub = 0.8;
}

function throwAt(wx, wy) {
  const p = G.players[me], enemy = other(me);
  if (!p || cooldown > 0) return;
  if (p.ammo[sel] <= 0) { toast('Bitti!', ITEMS[sel].name + ' kalmadı'); sfx('no'); return; }
  if (dirtyCount(enemy) + shots.length >= MAXSPLAT) { toast('Yeter!', 'Karşı taraf zaten leş gibi'); return; }
  const type = sel, L = lv(p).L, c = chars.me;
  p.ammo[type]--; cooldown = 0.4; c.throwT = 0.3;
  wx = clamp(wx + (Math.random() - .5) * 5, 5, W - 5); wy = clamp(wy + (Math.random() - .5) * 5, 5, HALF - 5);
  c.ang = Math.atan2(wy - c.y, wx - c.x);
  be.savePlayer(me); sfx('throw');
  launch(c, [wx, wy], type, () => {
    const [lx, ly] = toLocal(enemy, wx, wy), it = ITEMS[type];
    const es = baseScale(lv(G.players[enemy]).L);
    const hit = Math.abs(lx - 50) < 16 * es && Math.abs(ly - 68) < 9 * es;
    const mult = (1 + 0.07 * (L - 1)) * (hit ? 1.25 : 1);
    const s = { side: enemy, x: +lx.toFixed(1), y: +ly.toFixed(1), r: +(Math.min(26, it.r * mult)).toFixed(1), type, seed: (Math.random() * 1e9) | 0, by: myUid, at: Date.now() };
    be.addSplat(s);
    burst(wx, wy, splatColors(s), 22, 55); shake = 0.3; sfx('splat');
    const gain = Math.round(it.xp * (1 + 0.15 * (L - 1)) * (hit ? 1.5 : 1));
    if (hit) toast('Tam isabet!', '+' + gain + ' pislik puanı');
    addXp(p, gain);
  });
}
function addXp(p, gain) {
  const before = lv(p).L;
  p.xp += gain;
  const after = lv(p).L;

  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.02);
}
function sfx(n) {
  if (!ac || muted) return;
  try {
    if (n === 'throw') tone(300, 0.18, 'sine', 0.12, 700);
    else if (n === 'splat') { tone(170, 0.22, 'sawtooth', 0.14, 45); tone(90, 0.25, 'square', 0.08, 40); }
    else if (n === 'scrub') tone(900 + Math.random() * 500, 0.05, 'triangle', 0.03);
    else if (n === 'clean') { tone(700, 0.1, 'sine', 0.1); tone(1050, 0.14, 'sine', 0.1, 0, 0.08); }
    else if (n === 'no') tone(150, 0.15, 'square', 0.06, 110);
    else if (n === 'level') [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.12, 0, i * 0.09));
  } catch (e) {}
}

/* ---------- Arayüz ---------- */
const itemsEl = $('items'), bannerEl = $('banner'), toastEl = $('toast'), modalEl = $('modal');
for (const k of ORDER) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'item'; b.id = 'item-' + k;
  b.innerHTML = '<span class="dot" style="background:' + ITEMS[k].col + '"></span><span class="nm"></span><span class="ct"></span>';
  b.addEventListener('click', () => {
    audioInit();
    const p = G.players[me];
    if (!p || lv(p).L < ITEMS[k].unlock) { toast('Kilitli', ITEMS[k].name + ' ' + ITEMS[k].unlock + '. seviyede açılır'); return; }
    sel = k; hud();
  });
  itemsEl.append(b);
}
function toast(big, small) {
  toastEl.hidden = false; toastEl.textContent = big;
  if (small) { const s = document.createElement('small'); s.textContent = small; toastEl.append(s); }
  toastEl.style.animation = 'none'; void toastEl.offsetWidth; toastEl.style.animation = '';
}
function nudgeBanner() { bannerEl.classList.remove('shake'); void bannerEl.offsetWidth; bannerEl.classList.add('shake'); }
function hud() {
  const p = G.players[me], ep = G.players[other(me)], li = lv(p), L = li.L;
  regen(p);
  $('lvLabel').textContent = 'Seviye ' + L;
  $('xpBar').firstElementChild.style.width = (li.into / li.need * 100).toFixed(1) + '%';
  $('xpText').textContent = li.into + ' / ' + li.need;
  for (const k of ORDER) {
    const b = $('item-' + k), locked = L < ITEMS[k].unlock, n = p ? p.ammo[k] : 0;
    b.classList.toggle('locked', locked); b.classList.toggle('sel', k === sel && !locked); b.classList.toggle('empty', !locked && n === 0);
    b.children[1].textContent = ITEMS[k].name;
    b.children[2].textContent = locked ? 'Sv ' + ITEMS[k].unlock : n + '/' + cap(k, L);
  }
  const et = TEAM[other(me)];
  $('enemyChip').innerHTML = '<span class="swatch" style="background:' + et.main + '"></span>' +
    (ep ? '<b>Rakip</b> Sv ' + lv(ep).L + ' · leke ' + dirtyCount(other(me)) : '<b>Rakip</b> bekleniyor');
  const dirty = dirtyCount(me);
  let txt, warn = false;
  if (!ready) txt = 'Yükleniyor…';
  else if (!canPlay) txt = 'İzleyicisin';
  else if (dirty > 0) { txt = 'Önce temizle! Leke: ' + dirty; warn = true; }
  else txt = 'Karşı sahaya dokun, nişanla, bırak';
  bannerEl.textContent = txt; bannerEl.classList.toggle('warn', warn);
  $('passBtn').hidden = online || !started;
}

function showModal(html) { modalEl.innerHTML = '<div class="card">' + html + '</div>'; modalEl.hidden = false; }
function startCard() {
  const modeLine = !ready ? 'Bağlanıyor…'
    : online ? (canPlay ? 'Çevrimiçi oyun. Sen <b>' + TEAM[me].name + '</b> takımsın. Arkadaşın kendi telefonundan girdiğinde attıkların onu bekliyor olacak.' : note)
    : 'Tek telefon modu: sırayla oynayın, "Telefonu ver" ile oyuncu değişir.' + (note ? ' ' + note : '');
  showModal(
    '<h1>Domates Savaşı</h1>' +
    '<p>Karşı üssü pisliğe boğ, kendi sahanı temiz tut.</p>' +
    '<ul><li>Karşı sahaya dokun, sürükleyerek nişan al, bırakınca fırlat.</li>' +
    '<li>Sahan kirliyse önce temizle: lekeye dokunup basılı tut, karakterin paspaslar.</li>' +
    '<li>Pislettikçe seviye atlarsın: mermiler güçlenir, envanter ve üs büyür.</li></ul>' +
    '<p class="note">' + modeLine + '</p>' +
    '<div class="row"><button class="btn primary" type="button" data-act="start"' + (ready ? '' : ' disabled') + '>' + (ready ? (started ? 'Devam et' : 'Başla') : 'Bağlanıyor…') + '</button></div>');
}
function menuCard(confirmReset) {
  showModal(
    '<h2>Menü</h2>' +
    '<p>' + (online ? 'Çevrimiçi oyun · ' + (canPlay ? TEAM[me].name + ' takım' : 'izleyici') : 'Tek telefon modu · sıra ' + TEAM[me].name + ' takımda') + '</p>' +
    '<div class="row"><button class="btn ghost" type="button" data-act="help">Nasıl oynanır</button>' +
    '<button class="btn ghost" type="button" data-act="mute">Ses: ' + (muted ? 'kapalı' : 'açık') + '</button></div>' +
    (canPlay ? (confirmReset
      ? '<p class="note">İki oyuncunun da seviyesi, envanteri ve tüm lekeler silinecek.</p><div class="row"><button class="btn danger" type="button" data-act="reset-yes">Evet, sıfırla</button><button class="btn ghost" type="button" data-act="menu">Vazgeç</button></div>'
      : '<div class="row"><button class="btn ghost" type="button" data-act="reset">Oyunu sıfırla</button></div>') : '') +
    '<div class="row"><button class="btn primary" type="button" data-act="close">Oyuna dön</button></div>');
}
function passCard() {
  const next = other(me);
  showModal('<h2>Telefonu ' + TEAM[next].name + ' oyuncuya ver</h2><p>Sıra ' + TEAM[next].name + ' takımda. Sahanda leke varsa önce onları temizlemen gerekecek.</p>' +
    '<div class="row"><button class="btn primary" type="button" data-act="pass-go">Hazırım</button></div>');
}
modalEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  audioInit();
  const a = b.dataset.act;
  if (a === 'start' || a === 'close') { started = true; modalEl.hidden = true; hud(); }
  else if (a === 'help') startCard();
  else if (a === 'menu') menuCard(false);
  else if (a === 'mute') { muted = !muted; try { localStorage.setItem(LS + '-mute', muted ? '1' : '0'); } catch (err) {} menuCard(false); }
  else if (a === 'reset') menuCard(true);
  else if (a === 'reset-yes') { be.reset(); sel = 't'; shots.length = 0; modalEl.hidden = true; toast('Oyun sıfırlandı'); hud(); }
  else if (a === 'pass-go') { me = other(me); view = me; sel = 't'; resetChars(); shots.length = 0; parts.length = 0; modalEl.hidden = true; hud(); }
});
$('menuBtn').addEventListener('click', () => menuCard(false));
$('passBtn').addEventListener('click', () => { if (!shots.length) passCard(); });

/* ---------- Açılış ---------- */
function useLocal(msg) {
  online = false; note = msg || ''; G.splats.clear(); G.players = { A: null, B: null };
  be = localBE; be.init(); ready = true;
}
async function boot() {
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  let db = null, user = null;
  if (window.claude && window.claude.use) {
    try { [db, user] = await withTimeout(Promise.all([window.claude.use('db'), window.claude.use('user')]), 11000); } catch (e) {}
  }
  if (db) {
    try {
      const obe = makeOnlineBE(db);
      await withTimeout(obe.init(user), 10000);
      be = obe; online = true; ready = true;
      document.addEventListener('visibilitychange', () => { if (document.hidden) obe.flush(); });
    } catch (e) { useLocal('Çevrimiçi bağlantı kurulamadı.'); }
  } else useLocal('');
  const p = G.players[me];
  if (p) { regen(p); for (const k of ORDER) if (lv(p).L < ITEMS[k].unlock && sel === k) sel = 't'; }
  resetChars();
  if (!started) startCard();
  hud();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); startCard(); hud();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
setInterval(hud, 300);
requestAnimationFrame(frame);
boot();
})();
</script>
