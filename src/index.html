<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Görev Takip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Görev Takip</h1>
      <p class="subtitle">Bugün neler yapacaksın?</p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <input id="task-input" type="text" placeholder="Yeni görev ekle…" maxlength="200" required aria-label="Yeni görev">
      <button type="submit">Ekle</button>
    </form>

    <nav class="filters" aria-label="Filtreler">
      <button type="button" data-filter="all" class="active">Tümü</button>
      <button type="button" data-filter="active">Aktif</button>
      <button type="button" data-filter="done">Tamamlanan</button>
    </nav>

    <ul id="task-list" class="task-list"></ul>

    <footer class="summary">
      <span id="counter">0 görev kaldı</span>
      <button type="button" id="clear-done">Tamamlananları temizle</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
